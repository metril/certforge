services:
  certforge:
    build:
      args:
        # Compiles in the e2e-only "e2e-challtestsrv" DNS provider
        # (internal/challenge/challtestsrv_e2e.go), never built into a
        # production image. The compose server calls challtestsrv itself
        # (challtestsrv:8055) and Pebble (pebble:14000) over the compose
        # network; the e2e test drives all of that through the server's own
        # HTTP API (CF_E2E_BASE_URL), not by reaching those services
        # directly, so only Pebble's management port needs a host port below.
        GO_TAGS: e2e
    # Distinct from compose.yaml's ghcr.io/metril/certforge:dev tag: without
    # this, `make e2e`'s build would retag "dev" with the e2e-only provider
    # compiled in, and a later plain `docker compose up` (dev) would then run
    # that e2e image instead of rebuilding a production one.
    image: certforge:e2e
    # Merges with compose.yaml's own certforge.depends_on.postgres (long-form
    # map keys merge across -f files) so the server also waits on dex's own
    # healthcheck below, not just Postgres.
    depends_on:
      dex:
        condition: service_healthy
    # Task 15: the host-side go test process runs its own webhook sink on
    # CF_E2E_SINK_PORT (host, 0.0.0.0), and the webhook channel it creates
    # points at http://host.docker.internal:<port>/hook so the server
    # (inside this container) can reach it; host-gateway is Docker's own
    # special extra_hosts value, resolving to whatever address routes to
    # the host regardless of the host's actual IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The dev Dex issuer is http://dex:5556/dex (a compose service name,
      # not loopback), which the authentication settings section otherwise
      # refuses.
      CF_OIDC_ALLOW_INSECURE_ISSUER: "true"
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: -config test/config/pebble-config.json -strict -dnsserver challtestsrv:8053
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      # Disable authorization reuse so plan 1B's issuance e2e always sees a
      # fresh pending challenge instead of a cached valid authorization.
      PEBBLE_AUTHZREUSE: "0"
    volumes:
      # The bundled config with httpPort/tlsPort changed to match the
      # breadth e2e's fixed ports (Task 15): httpPort 8080 (server http-01
      # and the Traefik-routed agent http-01 both answer there) and tlsPort
      # 5001 (the agent's own tls-alpn-01 listener), copied from the image
      # via `docker create`/`docker cp` the same way Task 1's pre-flight did.
      - ./e2e/pebble-config.json:/test/config/pebble-config.json:ro
    ports:
      # Published so the host-side `go test` process (make e2e runs it
      # outside the compose network) can independently verify the issued
      # chain against https://localhost:${CF_PEBBLE_MGMT_PORT:-15000}/intermediates/0.
      # The ACME port itself is not published: the e2e test never talks to
      # Pebble directly, only the compose server does (over the compose
      # network, at pebble:14000).
      - "127.0.0.1:${CF_PEBBLE_MGMT_PORT:-15000}:15000"
    depends_on:
      - challtestsrv
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    command: -defaultIPv6 "" -defaultIPv4 127.0.0.1
    ports:
      # Published so the host-side `go test` process can add the A records
      # (Task 15) that route Pebble's http-01/tls-alpn-01 validation at
      # api.e2e/agent.e2e/alpn.e2e to the right compose-network container;
      # the server itself still reaches challtestsrv over the compose
      # network (challtestsrv:8055) for its dns-01 TXT records.
      - "127.0.0.1:${CF_CHALLTESTSRV_PORT:-18055}:8055"
  # ACME http-01 routing (Task 15's own agent grant, see the agent service
  # below): Pebble's http-01 validation for agent.e2e resolves to this
  # container, not the agent's own IP, so the only way it succeeds is
  # through the per-grant ACME router file the agent writes under
  # .e2e/traefik (deviation R4) once a grant with an acmeServiceUrl target
  # exists. TLS serving of an agent-deployed layout certificate
  # (certforge-<name>.yml) is still not exercised; see docs/PROGRESS.md
  # Known gaps. Separately (Task 15, R11), the websecure entrypoint below
  # serves a certificate the e2e test itself writes directly (not through
  # an agent grant) so TestOpsAgainstCompose's external monitor has a real
  # TLS endpoint reachable over the compose network at traefik:8443.
  traefik:
    profiles: [e2e]
    image: traefik:v3.1
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Not published to the host: the file provider watching a
      # cross-container bind mount is not instantaneous, so the breadth
      # e2e (fix round 1) polls a router's status here via `docker exec` +
      # wget, over the container's own localhost, before it relies on that
      # router actually forwarding a challenge.
      - --entrypoints.traefik.address=:8081
      - --api.insecure=true
      # Task 15 (R11): a second entrypoint, TLS terminated at the
      # entrypoint itself (http.tls=true, no router-level tls: {} needed),
      # serving whatever certforge-ops.yml's dynamic file sets as this
      # store's defaultCertificate. Not published to the host: only the
      # compose server dials it (TestOpsAgainstCompose's monitor targets
      # traefik:8443 over the compose network, never from the host).
      - --entrypoints.websecure.address=:8443
      - --entrypoints.websecure.http.tls=true
    volumes:
      - ../.e2e/traefik:/etc/traefik/dynamic:ro
  # A real TLS-terminating proxy for the agent protocol: the agent's agentUrl
  # is https://caddy:9443, Caddy terminates TLS with its internal CA and
  # forwards plain HTTP to the server's HTTP port (never the agent port). The
  # agent trusts Caddy's root through SSL_CERT_FILE (the system-roots path).
  caddy:
    profiles: [e2e]
    image: caddy:2.8.4-alpine
    user: "${CF_E2E_UID:-0}:${CF_E2E_GID:-0}"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /data/config
    volumes:
      - ./e2e/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../.e2e/caddy:/data
    depends_on:
      certforge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 3s
      retries: 30
  agent:
    # Only started for `make e2e` (which passes --profile e2e): the dev
    # Playwright stack brings up this same compose.test.yaml file without
    # that flag, and does not need the agent at all, so it must not create
    # the root-owned .e2e/agent-data et al. this service's default
    # CF_E2E_UID/GID (0:0, root) would leave behind when make e2e's own
    # export of the host uid/gid is not in play.
    profiles: [e2e]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: certforge-agent:e2e
    # The host user, so the host-side test can tamper with and clean up the
    # files it writes (owner/group are then ignored; a unit test covers chown).
    user: "${CF_E2E_UID:-0}:${CF_E2E_GID:-0}"
    restart: unless-stopped
    environment:
      CF_AGENT_DATA: /data
      # The test writes the token here after creating the client; run waits.
      CF_AGENT_TOKEN_FILE: /data/token
      # Confines every file the agent writes or removes to the layout's
      # /etc/ssl/certforge, the Traefik target's /etc/traefik/dynamic, and
      # (Task 15) an http-01 webroot under /srv/www; required for any
      # deploy or webroot write (empty means every write fails).
      CF_WRITE_ALLOW: /etc/ssl/certforge:/etc/traefik/dynamic:/srv/www
      # Task 15: the agent serves http-01 (reached only through Traefik's
      # per-grant ACME router, not published directly) and tls-alpn-01
      # (Pebble connects to this container directly on 5001, matching
      # deploy/e2e/pebble-config.json's tlsPort) itself.
      CF_AGENT_HTTP01_LISTEN: ":8080"
      CF_AGENT_TLSALPN_LISTEN: ":5001"
      # Caddy's internal root is the only root the agent needs, to reach the
      # proxy; it is not part of the agent CA bundle.
      SSL_CERT_FILE: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - ../.e2e/caddy:/caddy:ro
      - ../.e2e/agent-data:/data
      - ../.e2e/traefik:/etc/traefik/dynamic
      - ../.e2e/ssl:/etc/ssl/certforge
    depends_on:
      certforge:
        condition: service_healthy
      caddy:
        condition: service_healthy
      # Not because the agent needs it — it doesn't — but because
      # `docker compose up --wait` otherwise treats vault-init's own
      # (expected) exit(0) as the whole stack failing to come up, since
      # nothing else tells it that container is supposed to exit. Attached
      # here rather than to certforge (which is not profile-gated) so a
      # plain, non-e2e-profile `docker compose up` never references a
      # profile-e2e-only service at all.
      vault-init:
        condition: service_completed_successfully
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Container and default host port match so a browser mapping the name
      # dex to 127.0.0.1 reaches the same issuer URL the server uses.
      - "127.0.0.1:${CF_DEX_PORT:-5556}:5556"
    healthcheck:
      # The image has no curl; wget -q -O- exits non-zero on a non-2xx
      # response, which is all --wait needs here.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Task 15: SMTP sink for TestOpsAgainstCompose's email channel. The
  # compose server sends to mailpit:1025 (its "smtp" settings section
  # host, over the compose network); the host-side go test reads delivered
  # messages back through mailpit's own HTTP API, published at
  # CF_MAILPIT_PORT. No healthcheck: the test polls the HTTP API itself
  # (bounded) before relying on it, the same way waitForPebbleReady does
  # for Pebble's management API.
  mailpit:
    profiles: [e2e]
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${CF_MAILPIT_PORT:-18025}:8025"
  # Task 14: dev-mode Vault for the Transit KEK, vaultpki, vault-kv and the
  # readiness check's own "vault" entry. Dev mode is in-memory and always
  # unsealed with a fixed root token, which is exactly what the e2e's
  # "Vault down" step needs (docker compose pause/unpause instead of a
  # stop/start that would lose its state). Shared by make e2e (this
  # profile) and make e2e-web (5B's Playwright, brought up with the same
  # --profile e2e), so both get a running Vault without either target
  # needing its own copy of this service.
  vault:
    profiles: [e2e]
    image: hashicorp/vault:1.18
    command: server -dev
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${CF_E2E_VAULT_TOKEN:-certforge-e2e-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:${CF_VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  # One-shot: enables transit/pki/approle and verifies secret/ (dev-mode's
  # own default kv-v2 mount), then writes a fixed AppRole role_id/secret_id
  # to ../.e2e/vault for the compose.vault.yaml second boot (Task 14's own
  # deviation: the e2e first boots on the static KEK like every other e2e
  # test, then restarts certforge with that override once Transit and this
  # AppRole exist) to read. See deploy/e2e/vault-init.sh.
  vault-init:
    profiles: [e2e]
    image: hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/vault-init/vault-init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${CF_E2E_VAULT_TOKEN:-certforge-e2e-root}
    volumes:
      - ./e2e/vault-init.sh:/vault-init/vault-init.sh:ro
      - ../.e2e/vault:/e2e-vault
    depends_on:
      vault:
        condition: service_healthy
