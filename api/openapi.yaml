openapi: 3.0.3
info:
  title: CertForge API
  version: 0.1.0
  description: |
    CertForge REST API. All paths are relative to /api/v1.

    Authentication: the `cf_session` cookie set by POST /auth/login or POST /setup/complete.
    POST, PUT, PATCH, and DELETE with a session must send the `X-CSRF-Token` header with
    `csrfToken` from GET /auth/me. Request bodies must be `application/json`.

    Errors are RFC 9457 application/problem+json documents (see the Problem schema and
    components.responses): 400, 401, 403 (missing permission or CSRF failure), 404, 409,
    413, 415, 422, 429 (login rate limit, with Retry-After), 500, 502 (upstream CA or
    identity provider), 503 (busy, with Retry-After).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: meta
    description: Registries of pluggable types.
  - name: orgs
    description: Organizations.
  - name: auth
    description: Login, logout, and the current principal.
  - name: settings
    description: Schema-driven settings sections.
  - name: setup
    description: First-run setup wizard.
  - name: issuers
    description: CAs, ACME accounts and DNS credentials.
  - name: certificates
    description: Certificates and issuance defaults.
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: First-run status
      description: Whether the first-run setup wizard still needs to run. Public.
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500": {$ref: "#/components/responses/InternalError"}
  /setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Complete first-run setup
      description: Sets the local admin password, stores the base URL, creates the first org, and logs the admin in. Works once; later calls get 409. Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup done; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /meta/schemas:
    get:
      operationId: getMetaSchemas
      tags: [meta]
      summary: List pluggable type schemas
      description: JSON Schemas for every registered DNS provider, deploy target, notifier, and signer. The UI renders forms from them.
      responses:
        "200":
          description: Schemas grouped by kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaSchemas"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List organizations
      description: Organizations visible to the caller.
      responses:
        "200":
          description: Visible organizations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as the local admin
      description: Break-glass local admin login. Sets the cf_session cookie and revokes the user's other sessions. Rate limited per client address (429 with Retry-After).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Ends the current session and clears the cookie. Requires X-CSRF-Token.
      responses:
        "204":
          description: Logged out.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current principal
      description: The signed-in user, roles, visible orgs, and the CSRF token for mutating requests.
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: Available sign-in methods
      description: Which sign-in methods the login page offers. Public.
      security: []
      responses:
        "200":
          description: Sign-in methods.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthMethods"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/oidc/start:
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Start single sign-on
      description: Redirects the browser to the identity provider (auth code with PKCE) and sets a short-lived signed state cookie. Redirects to /login?error=oidc_disabled when single sign-on is off. Public.
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Same-origin path to open after sign-in; anything else becomes /.
          schema: {type: string}
      responses:
        "302":
          description: Redirect to the identity provider or back to /login.
          headers:
            Location:
              description: Redirect target.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Single sign-on callback
      description: The identity provider returns here. On success creates or updates the user by (issuer, subject), records groups, starts a session (revoking the user's others), and redirects to next. On failure redirects to /login?error= one of oidc_state, oidc_denied, oidc_failed, oidc_disabled, user_disabled, rate_limited. Public; rate limited per client address (redirects rather than returning 429).
      security: []
      parameters:
        - {name: code, in: query, required: false, description: Authorization code., schema: {type: string}}
        - {name: state, in: query, required: false, description: State echoed by the provider., schema: {type: string}}
        - {name: error, in: query, required: false, description: Error code from the provider., schema: {type: string}}
        - {name: error_description, in: query, required: false, description: Provider error text; logged only., schema: {type: string}}
      responses:
        "302":
          description: Redirect to next or to /login?error=.
          headers:
            Location:
              description: Redirect target.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/authentication/test:
    post:
      operationId: testAuthentication
      tags: [settings]
      summary: Test an OIDC issuer
      description: Fetches the issuer's discovery document and JWKS without logging in. Needs settings:write. Always 200; ok false carries the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthenticationTestRequest"}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthenticationTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/{section}:
    parameters:
      - name: section
        in: path
        required: true
        description: Section name, for example general, backup, or issuance_defaults.
        schema:
          type: string
    get:
      operationId: getSettingsSection
      tags: [settings]
      summary: Read a settings section
      description: Returns the section's JSON Schema and its current value (the default when unset).
      responses:
        "200":
          description: Section schema and value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSection"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: putSettingsSection
      tags: [settings]
      summary: Replace a settings section
      description: >-
        Validates the value against the section schema (422 on failure) and stores it. Admin only.
        For a secret property (schema "secret": true), send "__unchanged__" or omit the field to keep
        the stored value, "" to clear it, or any other string to replace it; "__unchanged__" with
        nothing stored is a 422. Secret values are never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsValue"
      responses:
        "200":
          description: Stored section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSection"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /meta/ca-presets:
    get:
      operationId: listCaPresets
      tags: [issuers]
      summary: List CA presets
      description: Well-known ACME CAs with their directory URLs and whether they require External Account Binding. Needs cas:read.
      responses:
        "200":
          description: Presets in display order.
          content:
            application/json:
              schema:
                type: array
                description: Presets.
                items: {$ref: "#/components/schemas/CAPreset"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/cas:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listCas
      tags: [issuers]
      summary: List ACME CAs
      description: CAs of the org sorted by name. Needs cas:read.
      responses:
        "200":
          description: All CAs of the org.
          content:
            application/json:
              schema:
                type: array
                description: CAs.
                items: {$ref: "#/components/schemas/CA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createCa
      tags: [issuers]
      summary: Add an ACME CA
      description: Needs cas:write (global admin). A preset fills directoryUrl when omitted. Presets that require EAB return 422 without eabKid and eabHmac.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CAInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/cas/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getCa
      tags: [issuers]
      summary: Get a CA
      description: Needs cas:read.
      responses:
        "200":
          description: The CA.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateCa
      tags: [issuers]
      summary: Replace a CA
      description: Needs cas:write. eabHmac omitted, null or __unchanged__ keeps the stored HMAC; an empty string removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CAInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteCa
      tags: [issuers]
      summary: Delete a CA
      description: Needs cas:write. 409 while accounts, certificates or defaults reference it.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/acme-accounts:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listAcmeAccounts
      tags: [issuers]
      summary: List ACME accounts
      description: Accounts of the org sorted by email. Needs accounts:read.
      responses:
        "200":
          description: All accounts of the org.
          content:
            application/json:
              schema:
                type: array
                description: Accounts.
                items: {$ref: "#/components/schemas/AcmeAccount"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createAcmeAccount
      tags: [issuers]
      summary: Register an ACME account
      description: Needs accounts:write. Registers at the CA now (with the CA's EAB) and stores the account key encrypted. A CA rejection returns 502 with the ACME problem in detail.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcmeAccountInput"}
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcmeAccount"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /orgs/{orgId}/acme-accounts/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getAcmeAccount
      tags: [issuers]
      summary: Get an ACME account
      description: Needs accounts:read.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcmeAccount"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteAcmeAccount
      tags: [issuers]
      summary: Delete an ACME account
      description: Needs accounts:write. Removes the stored account only; it is not deactivated at the CA. 409 while referenced.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listDNSCredentials
      tags: [issuers]
      summary: List DNS credentials
      description: Credentials of the org sorted by name, without secrets. Needs dnscreds:read.
      responses:
        "200":
          description: All credentials of the org.
          content:
            application/json:
              schema:
                type: array
                description: Credentials.
                items: {$ref: "#/components/schemas/DNSCredential"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createDNSCredential
      tags: [issuers]
      summary: Add a DNS credential
      description: Needs dnscreds:write. config keys must be properties of the provider schema from GET /meta/schemas; fields with secret true are stored encrypted. Unknown keys, a key with a serverPath schema property, or a provider marked unsupported all return 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getDNSCredential
      tags: [issuers]
      summary: Get a DNS credential
      description: Secrets are never returned. Needs dnscreds:read.
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateDNSCredential
      tags: [issuers]
      summary: Replace a DNS credential
      description: Needs dnscreds:write. config is replaced as a whole; a secret field set to __unchanged__ keeps its stored value and a secret field left out is removed. The provider cannot change; 422 if it is (or has since become) marked unsupported.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialUpdate"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteDNSCredential
      tags: [issuers]
      summary: Delete a DNS credential
      description: Needs dnscreds:write. 409 while certificates, org defaults or the global defaults reference it.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials/{id}/test:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: testDNSCredential
      tags: [issuers]
      summary: Test a DNS credential
      description: Needs dnscreds:write. Creates and removes a TXT record at _acme-challenge._certforge-test.<zone> (lego always adds the _acme-challenge label). Provider failures return 200 with ok false; error text has every config value redacted. Past a bounded timeout the response is ok false with error "timed out", but cleanup keeps running in the background. At most 2 tests run at once server-wide; beyond that this returns 503 with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialTestRequest"}
      responses:
        "200":
          description: Test outcome.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredentialTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /orgs/{orgId}/issuance-defaults:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getOrgIssuanceDefaults
      tags: [certificates]
      summary: Get org issuance defaults
      description: The org level only; null fields inherit from the global settings section issuance_defaults. Needs certs:read.
      responses:
        "200":
          description: Org defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuanceDefaults"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: putOrgIssuanceDefaults
      tags: [certificates]
      summary: Replace org issuance defaults
      description: Null or omitted fields inherit from global. Applies at each inheriting certificate's next renewal. Needs certs:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssuanceDefaults"}
      responses:
        "200":
          description: Stored defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuanceDefaults"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/issuance-defaults/effective:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getEffectiveIssuanceDefaults
      tags: [certificates]
      summary: Get effective org defaults
      description: Each field's resolved value and the level it came from (default, global, org). Needs certs:read.
      responses:
        "200":
          description: Effective defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EffectiveIssuanceDefaults"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates
      description: Needs certs:read. status filters by status; q matches the name and any certificate name; sort is name, notAfter, nextRenewAt or status, with a leading - for descending.
      parameters:
        - {$ref: "#/components/parameters/ListStatus"}
        - {$ref: "#/components/parameters/ListQ"}
        - {$ref: "#/components/parameters/ListSort"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of certificates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Create a certificate
      description: Needs certs:write. Names are validated and de-duplicated; the first issuance is queued immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getCertificate
      tags: [certificates]
      summary: Get a certificate
      description: Needs certs:read.
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Replace a certificate definition
      description: Needs certs:write. Changing names queues a new issuance; other changes apply at the next renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      description: Deletes the definition with all versions and attempts; does not revoke. Needs certs:write.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/renew:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: renewCertificate
      tags: [certificates]
      summary: Issue now
      description: Queues an issuance. enqueued is false when one is already queued or running. Needs certs:issue.
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RenewResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /orgs/{orgId}/certificates/{id}/versions:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listCertificateVersions
      tags: [certificates]
      summary: List versions
      description: Issued versions, newest first. Needs certs:read.
      responses:
        "200":
          description: All versions.
          content:
            application/json:
              schema:
                type: array
                description: Versions.
                items: {$ref: "#/components/schemas/CertificateVersion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/attempts:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listIssuanceAttempts
      tags: [certificates]
      summary: List issuance attempts
      description: The 50 newest attempts with step timeline and log. Needs certs:read.
      responses:
        "200":
          description: Attempts, newest first.
          content:
            application/json:
              schema:
                type: array
                description: Attempts.
                items: {$ref: "#/components/schemas/IssuanceAttempt"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/versions/{vid}/download:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/VersionId"}
    get:
      operationId: downloadCertificateVersion
      tags: [certificates]
      summary: Download a version
      description: Needs certs:read; the key and combined parts also need keys:export and are recorded in the audit log before anything is sent. One part returns a PEM file, several a zip.
      parameters:
        - name: format
          in: query
          required: false
          description: Output format; Phase 1 supports pem.
          schema: {type: string, enum: [pem], default: pem}
        - name: parts
          in: query
          required: true
          description: Comma-separated parts from cert, chain, fullchain, key, combined (fullchain plus key).
          schema: {type: string, example: "fullchain,key"}
      responses:
        "200":
          description: File contents.
          headers:
            Content-Disposition:
              description: Attachment file name.
              schema: {type: string}
          content:
            application/x-pem-file:
              schema: {type: string, format: binary, description: PEM file.}
            application/zip:
              schema: {type: string, format: binary, description: Zip of PEM files.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/manual-dns:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listManualDNS
      tags: [certificates]
      summary: List pending manual TXT records
      description: Records an operator must add; empty unless a manual-dns attempt is waiting. Needs certs:read.
      responses:
        "200":
          description: Pending records.
          content:
            application/json:
              schema:
                type: array
                description: Records.
                items: {$ref: "#/components/schemas/ManualDNSRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/manual-dns/confirm:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: confirmManualDNS
      tags: [certificates]
      summary: Confirm manual TXT records
      description: Resumes the waiting attempt. 409 when nothing is waiting or the records expired. Needs certs:issue.
      responses:
        "202":
          description: Confirmed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManualDNSConfirmResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cf_session
      description: Session cookie from POST /auth/login.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Org id.
      schema: {type: string, format: uuid}
    Id:
      name: id
      in: path
      required: true
      description: Resource id.
      schema: {type: string, format: uuid}
    VersionId:
      name: vid
      in: path
      required: true
      description: Certificate version id.
      schema: {type: string, format: uuid}
    ListStatus:
      name: status
      in: query
      required: false
      description: Only certificates with this status.
      schema: {type: string, enum: [pending, active, failed, expired, revoked]}
    ListQ:
      name: q
      in: query
      required: false
      description: Case-insensitive substring of the name or any certificate name.
      schema: {type: string}
    ListSort:
      name: sort
      in: query
      required: false
      description: name, notAfter, nextRenewAt or status; prefix - for descending. Default name.
      schema: {type: string}
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 500.
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    ListCursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page.
      schema: {type: string}
  responses:
    BadRequest:
      description: Malformed request, query parameter, or JSON body.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: Not signed in, or the session or API key is invalid, expired, or revoked.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Missing permission, or a session request without a valid X-CSRF-Token.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: No such resource visible to the caller.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Conflicts with current state, for example a duplicate name, existing dependents, or nothing to confirm.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PayloadTooLarge:
      description: Request body exceeds 1 MiB.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnsupportedMediaType:
      description: Request body is not application/json.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnprocessableEntity:
      description: The body parsed but failed validation; the title or detail names the field.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: Too many login attempts from this address.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    BadGateway:
      description: An upstream CA or identity provider rejected the request; detail carries its error.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: Unexpected server error; details are in the server log.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceUnavailable:
      description: Temporarily at capacity.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, sent with content type application/problem+json.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Problem type URI; about:blank for generic HTTP errors.
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
    Org:
      type: object
      description: An organization; most resources are scoped to one.
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
          description: Org id.
        slug:
          type: string
          description: URL-safe identifier, lowercase letters, digits, and hyphens.
        name:
          type: string
          description: Display name.
    OrgList:
      type: object
      description: A list of organizations.
      required: [items]
      properties:
        items:
          type: array
          description: Organizations sorted by name.
          items:
            $ref: "#/components/schemas/Org"
    SchemaEntry:
      type: object
      description: One registered pluggable type.
      required: [code, name, schema]
      properties:
        code:
          type: string
          description: Stable type code, for example cloudflare.
        name:
          type: string
          description: Display name.
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the type's configuration. Fields with secret true are write-only.
        aliases:
          type: array
          description: Other codes that select this type; used by search.
          items:
            type: string
    MetaSchemas:
      type: object
      description: Pluggable type schemas grouped by kind.
      required: [dnsProviders, deployTargets, notifiers, signers]
      properties:
        dnsProviders:
          type: array
          description: DNS-01 providers.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        deployTargets:
          type: array
          description: Deploy targets.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        notifiers:
          type: array
          description: Notification channels.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        signers:
          type: array
          description: Private CA signers.
          items:
            $ref: "#/components/schemas/SchemaEntry"
    LoginRequest:
      type: object
      description: Local admin credentials.
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Local admin password.
    AuthMethods:
      type: object
      description: Sign-in methods offered on the login page.
      required: [oidcEnabled, localEnabled]
      properties:
        oidcEnabled: {type: boolean, description: Single sign-on is enabled and configured.}
        localEnabled: {type: boolean, description: A local (break-glass) admin exists.}
    AuthenticationTestRequest:
      type: object
      description: The issuer to test, usually the unsaved value from the form.
      required: [issuer]
      properties:
        issuer: {type: string, description: OIDC issuer URL.}
    AuthenticationTestResult:
      type: object
      description: Result of fetching discovery and JWKS.
      required: [ok]
      properties:
        ok: {type: boolean, description: Discovery and JWKS were fetched and the JWKS has at least one key.}
        detail: {type: string, description: Why the test failed.}
        authorizationEndpoint: {type: string, description: Authorization endpoint from discovery.}
        tokenEndpoint: {type: string, description: Token endpoint from discovery.}
        keys: {type: integer, description: Number of signing keys in the JWKS.}
    User:
      type: object
      description: A CertForge user.
      required: [id, displayName, localAdmin]
      properties:
        id:
          type: string
          format: uuid
          description: User id.
        displayName:
          type: string
          description: Name shown in the UI.
        localAdmin:
          type: boolean
          description: True for the break-glass local admin.
    Role:
      type: string
      enum: [admin, org-admin, operator, viewer, auditor]
      description: A role. admin is everything; org-admin everything in its org except global-only actions; operator certificates, credentials, accounts, clients, issue and renew; viewer read-only; auditor viewer plus the audit log.
    MeBinding:
      type: object
      description: One role held by the signed-in principal.
      required: [role, orgId]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        orgId:
          type: string
          format: uuid
          nullable: true
          description: The org the role applies to; null for a global binding.
    Me:
      type: object
      description: The signed-in principal.
      required: [user, roles, bindings, orgs, csrfToken]
      properties:
        user:
          description: The signed-in user.
          allOf:
            - $ref: "#/components/schemas/User"
        roles:
          type: array
          description: Distinct role names bound to the user.
          items:
            type: string
        bindings:
          type: array
          description: The roles behind `roles`, with their scope. The UI mirrors authz.Can from these.
          items: {$ref: "#/components/schemas/MeBinding"}
        orgs:
          type: array
          description: Orgs the user can see.
          items:
            $ref: "#/components/schemas/Org"
        csrfToken:
          type: string
          description: Send in the X-CSRF-Token header on every POST, PUT, PATCH, and DELETE.
    SettingsValue:
      type: object
      additionalProperties: true
      description: A settings section value; its shape is defined by the section schema.
    SettingsSection:
      type: object
      description: A settings section with its schema.
      required: [section, schema, value, stored, storedSecrets]
      properties:
        section:
          type: string
          description: Section name.
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) of the value; the UI renders the form from it.
        value:
          description: The section's effective value — its own stored value, or the section's built-in default when it has never been saved. Secret properties are never included here.
          allOf:
            - $ref: "#/components/schemas/SettingsValue"
        stored:
          description: The raw value actually saved for this section, before built-in defaults are filled in; null when the section has never been saved. Lets a client tell "never configured" apart from "explicitly set to the built-in value" (value alone cannot, since it always looks concrete once a default is filled in). Secret properties are never included here.
          allOf:
            - $ref: "#/components/schemas/SettingsValue"
          nullable: true
        storedSecrets:
          type: array
          description: Names of the section's secret properties that currently hold a value. Secret values are never returned; send "__unchanged__" to keep one, "" to clear it.
          items: {type: string}
    SetupStatus:
      type: object
      description: First-run state.
      required: [needsSetup]
      properties:
        needsSetup:
          type: boolean
          description: True until POST /setup/complete succeeds.
    SetupRequest:
      type: object
      description: First-run wizard input.
      required: [adminPassword, orgName, orgSlug, baseUrl]
      properties:
        adminPassword:
          type: string
          format: password
          minLength: 12
          description: New local admin password, at least 12 characters.
        orgName:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the first org.
        orgSlug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          description: URL-safe identifier of the first org.
        baseUrl:
          type: string
          description: Public URL of this CertForge instance, for example https://certs.example.com.
    CAPresetCode:
      type: string
      description: CA preset code; custom takes any directory URL.
      enum: [letsencrypt, letsencrypt-staging, zerossl, buypass, google, sslcom, custom]
    CAPreset:
      type: object
      description: A well-known ACME CA.
      required: [preset, name, directoryUrl, requiresEab]
      properties:
        preset:
          description: Preset code.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        name: {type: string, description: Display name.}
        directoryUrl: {type: string, description: ACME directory URL; empty for custom.}
        requiresEab: {type: boolean, description: The CA needs External Account Binding.}
    CA:
      type: object
      description: An ACME certificate authority.
      required: [id, name, preset, directoryUrl, resolvers]
      properties:
        id: {type: string, format: uuid, description: CA id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        preset:
          description: Preset code.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        directoryUrl: {type: string, description: ACME directory URL.}
        trustBundlePem: {type: string, description: Extra PEM roots for a private ACME server.}
        eabKid: {type: string, description: EAB key id; empty when unused.}
        hasEab: {type: boolean, description: An EAB HMAC is stored (it is never returned).}
        resolvers: {type: array, items: {type: string}, description: DNS resolvers (host or host:port) for propagation checks.}
        shared: {type: boolean, description: Reserved for Phase 2 global CAs; false in Phase 1.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    CAInput:
      type: object
      description: Fields to create or replace a CA.
      required: [name, preset]
      properties:
        name: {type: string, description: Unique name in the org.}
        preset:
          description: Preset code.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        directoryUrl: {type: string, description: Required for custom; defaults to the preset URL.}
        trustBundlePem: {type: string, description: Extra PEM roots.}
        eabKid: {type: string, description: EAB key id.}
        eabHmac: {type: string, nullable: true, writeOnly: true, description: "EAB HMAC key (base64url). Write-only: on update null or __unchanged__ keeps it, empty string removes it."}
        resolvers: {type: array, items: {type: string}, description: DNS resolvers for propagation checks.}
    AcmeAccount:
      type: object
      description: A registered ACME account; its key never leaves the server.
      required: [id, caId, email, status, registrationUri]
      properties:
        id: {type: string, format: uuid, description: Account id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        caId: {type: string, format: uuid, description: CA the account is registered with.}
        email: {type: string, description: Contact email.}
        status: {type: string, enum: [valid, deactivated], description: Account status.}
        registrationUri: {type: string, description: Account URL (kid) at the CA.}
        createdAt: {type: string, format: date-time, description: Registration time.}
    AcmeAccountInput:
      type: object
      description: Account to register.
      required: [caId, email]
      properties:
        caId: {type: string, format: uuid, description: CA to register with.}
        email: {type: string, description: Contact email.}
    DNSCredential:
      type: object
      description: A DNS provider credential. Secret values are never returned.
      required: [id, name, providerCode, config]
      properties:
        id: {type: string, format: uuid, description: Credential id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        providerCode: {type: string, description: Provider code from GET /meta/schemas dnsProviders.}
        config: {type: object, additionalProperties: {type: string}, description: Non-secret field values.}
        storedSecrets: {type: array, items: {type: string}, description: Secret fields that have a stored value.}
        usedBy: {type: integer, description: Certificates and defaults whose rules reference this credential.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    DNSCredentialInput:
      type: object
      description: A new DNS credential.
      required: [name, providerCode, config]
      properties:
        name: {type: string, description: Unique name in the org.}
        providerCode: {type: string, description: Provider code or alias.}
        config: {type: object, additionalProperties: {type: string}, description: Field values keyed by schema property.}
    DNSCredentialUpdate:
      type: object
      description: Replacement name and config.
      required: [name, config]
      properties:
        name: {type: string, description: Unique name in the org.}
        config: {type: object, additionalProperties: {type: string}, description: Full config; secret fields may be __unchanged__.}
    DNSCredentialTestRequest:
      type: object
      description: Zone to test against.
      required: [zone]
      properties:
        zone: {type: string, example: example.com, description: A zone the credential manages.}
    DNSCredentialTestResult:
      type: object
      description: Outcome of a credential test.
      required: [ok, fqdn, durationMs]
      properties:
        ok: {type: boolean, description: The record was created and removed.}
        fqdn: {type: string, description: TXT record name used; empty if the test timed out before it was known.}
        error: {type: string, description: "Provider error when ok is false, with every config value redacted; \"timed out\" past the bounded timeout (cleanup keeps running in the background)."}
        durationMs: {type: integer, description: Test duration in milliseconds.}
    KeyType:
      type: string
      description: Certificate key algorithm.
      enum: [rsa2048, rsa3072, rsa4096, ec256, ec384]
    RenewPolicy:
      type: object
      description: When to renew.
      required: [mode, value, useAri]
      properties:
        mode: {type: string, enum: [days, percent], description: "days: renew value days before expiry. percent: renew when value percent of the lifetime remains."}
        value: {type: integer, minimum: 1, maximum: 365, description: Days (1-365) or percent (1-99).}
        useAri: {type: boolean, description: Stored now; ACME Renewal Information is used from Phase 4.}
    VerificationRule:
      type: object
      description: How to prove control of the names this rule matches. First match wins.
      required: [match, method]
      properties:
        match: {type: string, example: "*.example.com", description: "* (every name), *.zone (names one label below zone, and *.zone itself), or zone (the zone, its subdomains and wildcards)."}
        method: {type: string, enum: [dns-01, manual-dns], description: Verification method.}
        dnsCredentialId: {type: string, format: uuid, description: DNS credential; required for dns-01.}
        propagationSeconds: {type: integer, minimum: 0, maximum: 3600, description: Propagation timeout override.}
        resolvers: {type: array, items: {type: string}, description: Resolvers for propagation checks.}
        cnameAliasZone: {type: string, description: Zone that _acme-challenge is CNAMEd into; checked before validation.}
    IssuanceDefaults:
      type: object
      description: One level of issuance settings (org defaults or certificate overrides). Null or omitted inherits from the level above.
      properties:
        caId: {type: string, format: uuid, nullable: true, description: CA.}
        accountId: {type: string, format: uuid, nullable: true, description: ACME account; must belong to the CA.}
        keyType: {allOf: [{$ref: "#/components/schemas/KeyType"}], nullable: true, description: Key algorithm.}
        renewPolicy: {allOf: [{$ref: "#/components/schemas/RenewPolicy"}], nullable: true, description: Renewal policy.}
        preferredChain: {type: string, nullable: true, description: Issuer common name of the preferred alternate chain.}
        reuseKey: {type: boolean, nullable: true, description: Keep the private key across renewals.}
        mustStaple: {type: boolean, nullable: true, description: Request OCSP must-staple.}
        verificationRules: {type: array, nullable: true, items: {$ref: "#/components/schemas/VerificationRule"}, description: Catch-all rules checked after a certificate's own rules.}
        propagationSeconds: {type: integer, nullable: true, minimum: 0, maximum: 3600, description: Propagation timeout in seconds.}
        resolvers: {type: array, nullable: true, items: {type: string}, description: Resolvers for propagation checks.}
    Source:
      type: string
      description: Level an effective value came from; default means the built-in value.
      enum: [default, global, org, cert]
    EffectiveUuid:
      type: object
      description: Effective id and its source.
      required: [source]
      properties:
        value: {type: string, format: uuid, nullable: true, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveString:
      type: object
      description: Effective string and its source.
      required: [value, source]
      properties:
        value: {type: string, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveBool:
      type: object
      description: Effective flag and its source.
      required: [value, source]
      properties:
        value: {type: boolean, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveInt:
      type: object
      description: Effective number and its source.
      required: [value, source]
      properties:
        value: {type: integer, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveStrings:
      type: object
      description: Effective string list and its source.
      required: [value, source]
      properties:
        value: {type: array, items: {type: string}, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveRenewPolicy:
      type: object
      description: Effective renewal policy and its source.
      required: [value, source]
      properties:
        value:
          description: Resolved renewal policy.
          allOf:
            - $ref: "#/components/schemas/RenewPolicy"
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveRules:
      type: object
      description: Effective catch-all rules and their source.
      required: [value, source]
      properties:
        value: {type: array, items: {$ref: "#/components/schemas/VerificationRule"}, description: Resolved rules.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveIssuanceDefaults:
      type: object
      description: Resolved issuance settings, each with the level it came from.
      properties:
        caId:
          description: Resolved CA and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveUuid"
        accountId:
          description: Resolved ACME account and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveUuid"
        keyType:
          description: Resolved key algorithm and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveString"
        renewPolicy:
          description: Resolved renewal policy and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveRenewPolicy"
        preferredChain:
          description: Resolved preferred chain and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveString"
        reuseKey:
          description: Resolved reuse-key flag and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveBool"
        mustStaple:
          description: Resolved must-staple flag and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveBool"
        verificationRules:
          description: Resolved catch-all rules and their source.
          allOf:
            - $ref: "#/components/schemas/EffectiveRules"
        propagationSeconds:
          description: Resolved propagation timeout and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveInt"
        resolvers:
          description: Resolved resolvers and their source.
          allOf:
            - $ref: "#/components/schemas/EffectiveStrings"
    CertificateVersion:
      type: object
      description: One issued certificate.
      required: [id, serial, notBefore, notAfter, sha256Fingerprint, source]
      properties:
        id: {type: string, format: uuid, description: Version id.}
        serial: {type: string, description: Serial number, lower-case hex.}
        notBefore: {type: string, format: date-time, description: Start of validity.}
        notAfter: {type: string, format: date-time, description: End of validity.}
        sha256Fingerprint: {type: string, description: SHA-256 of the leaf DER, lower-case hex.}
        keyType:
          description: Key algorithm.
          allOf:
            - $ref: "#/components/schemas/KeyType"
        source: {type: string, enum: [issued, imported, uploaded], description: How the version was obtained.}
        revokedAt: {type: string, format: date-time, nullable: true, description: Revocation time.}
        createdAt: {type: string, format: date-time, description: When it was stored.}
    Certificate:
      type: object
      description: A managed certificate.
      required: [id, name, commonName, sans, verificationRules, overrides, status, failureCount, effective]
      properties:
        id: {type: string, format: uuid, description: Certificate id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        commonName: {type: string, description: First name; the certificate subject.}
        sans: {type: array, items: {type: string}, description: Names besides the common name.}
        verificationRules:
          type: array
          description: Certificate rules, checked before the inherited catch-all rules.
          items: {$ref: "#/components/schemas/VerificationRule"}
        overrides:
          description: Per-certificate overrides of issuance settings.
          allOf:
            - $ref: "#/components/schemas/IssuanceDefaults"
        status: {type: string, enum: [pending, active, failed, expired, revoked], description: "pending until first issued; active while a valid version exists."}
        currentVersion:
          description: Newest issued version.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CertificateVersion"
        nextRenewAt: {type: string, format: date-time, nullable: true, description: Next scheduled issuance or retry.}
        failureCount: {type: integer, description: Consecutive failed attempts.}
        lastError: {type: string, nullable: true, description: Error of the last failed attempt.}
        effective:
          description: Resolved issuance settings for this certificate.
          allOf:
            - $ref: "#/components/schemas/EffectiveIssuanceDefaults"
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    CertificateInput:
      type: object
      description: Fields to create or replace a certificate.
      required: [name, commonName]
      properties:
        name: {type: string, description: Unique name in the org.}
        commonName: {type: string, description: Common name.}
        sans: {type: array, items: {type: string}, description: More names; the common name may repeat here.}
        verificationRules:
          type: array
          description: Ordered rules.
          items: {$ref: "#/components/schemas/VerificationRule"}
        overrides:
          description: Per-certificate overrides of issuance settings.
          allOf:
            - $ref: "#/components/schemas/IssuanceDefaults"
    CertificateList:
      type: object
      description: One page of certificates.
      required: [items]
      properties:
        items:
          type: array
          description: Certificates.
          items: {$ref: "#/components/schemas/Certificate"}
        nextCursor: {type: string, nullable: true, description: Cursor for the next page; null on the last page.}
    AttemptStep:
      type: object
      description: One step of an attempt.
      required: [name, status, startedAt]
      properties:
        name: {type: string, example: "challenge *.example.com", description: "caa, rate_ledger, account, order, challenge <name>, finalize or store."}
        status: {type: string, enum: [pending, running, success, failed, skipped, waiting_manual], description: Step state.}
        startedAt: {type: string, format: date-time, description: Start time.}
        finishedAt: {type: string, format: date-time, nullable: true, description: End time.}
        message: {type: string, nullable: true, description: Detail or error.}
    IssuanceAttempt:
      type: object
      description: One issuance run.
      required: [id, startedAt, outcome, steps, log]
      properties:
        id: {type: string, format: uuid, description: Attempt id.}
        startedAt: {type: string, format: date-time, description: Start time.}
        finishedAt: {type: string, format: date-time, nullable: true, description: End time.}
        outcome: {type: string, enum: [running, success, failed], description: Result.}
        acmeErrorType: {type: string, nullable: true, example: "urn:ietf:params:acme:error:rateLimited", description: ACME problem type of the failure.}
        retryAfter: {type: string, format: date-time, nullable: true, description: Earliest retry the CA allows.}
        steps:
          type: array
          description: Step timeline.
          items: {$ref: "#/components/schemas/AttemptStep"}
        log: {type: string, description: Attempt log.}
    ManualDNSRecord:
      type: object
      description: A TXT record the operator must add.
      required: [name, type, value, ttl]
      properties:
        name: {type: string, example: _acme-challenge.lab.example.com, description: Record name.}
        type: {type: string, enum: [TXT], description: Record type.}
        value: {type: string, description: Record value.}
        ttl: {type: integer, description: Suggested TTL in seconds.}
        expiresAt: {type: string, format: date-time, description: The attempt fails if not confirmed by then.}
    ManualDNSConfirmResult:
      type: object
      description: Confirmation result.
      required: [confirmed]
      properties:
        confirmed: {type: integer, description: Records confirmed.}
    RenewResult:
      type: object
      description: Renew request result.
      required: [enqueued]
      properties:
        enqueued: {type: boolean, description: False when an issuance was already queued or running.}
