        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/deploy-targets:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listDeployTargets
      tags: [delivery]
      summary: List deploy targets
      description: Needs delivery:read.
      responses:
        "200":
          description: Targets sorted by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeployTargetList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createDeployTarget
      tags: [delivery]
      summary: Create a deploy target
      description: >-
        Needs delivery:write; also keys:export when the resolved config needs the certificate's
        private key. config is validated against the type's schema from GET /meta/schemas
        (deployTargets). runsOn is required (422 "choose where this target run") for a type
        whose own runsOn is either (422 "choose where this target runs" without it), optional and
        must match the type's forced runsOn otherwise (422 naming it). Every URL in config is
        checked against the URL policy (422 "address not allowed").
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeployTargetInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeployTarget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/deploy-targets/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getDeployTarget
      tags: [delivery]
      summary: Get a deploy target
      description: Needs delivery:read.
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeployTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      operationId: updateDeployTarget
      tags: [delivery]
      summary: Replace a deploy target
      description: >-
        Needs delivery:write; also keys:export when the resolved config needs the certificate's
        private key, re-checked on every update. type and runsOn cannot change (422). A secret
        field of config sent as __unchanged__, or omitted, keeps its stored value (422 "<field>
        has no stored value" when there is none to keep); an explicit "" clears it, and clearing
        a required secret is its own 422. Changing a URL while a secret is reused needs every
        secret re-entered (422 "re-enter the secret"). Every URL in config is
        checked against the URL policy (422 "address not allowed"). Every grant using it is
        re-rendered and its client's revision bumped in the same transaction; 409 when that would
        make two of a client's grants write one path.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeployTargetInput"}
      responses:
        "200":
          description: Updated target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeployTarget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteDeployTarget
      tags: [delivery]
      summary: Delete a deploy target
      description: Needs delivery:write. 409 while any grant uses it; the detail names up to five client/certificate pairs.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/deploy-targets/{id}/grants:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listTargetGrants
      tags: [clients]
      summary: List a deploy target's server-side grants
      description: Needs clients:read. Live grants on this target (runsOn server), sorted by certificate name.
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema:
                type: array
                description: Grants.
                items: {$ref: "#/components/schemas/Grant"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createServerGrant
      tags: [clients]
      summary: Grant a certificate to a server-side deploy target
      description: >-
        Needs clients:write; also keys:export when the target's config has includeKey true. 422
        when the target's runsOn is agent (an agent target takes grants through POST
        /orgs/{orgId}/clients/{id}/grants instead). One grant per certificate per target (409).
        Recorded as grant.create in the audit log with runsOn: server and includeKey.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerGrantInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Grant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/hooks:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listHooks
      tags: [delivery]
      summary: List hooks
      description: Needs delivery:read.
      responses:
        "200":
          description: Hooks sorted by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HookList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createHook
      tags: [delivery]
      summary: Create a hook
      description: Needs delivery:write. argv[0] is an absolute executable path; hooks never run through a shell, and an agent runs a hook only when argv[0] is in its CF_HOOK_ALLOW list.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HookInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hook"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/hooks/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getHook
      tags: [delivery]
      summary: Get a hook
      description: Needs delivery:read.
      responses:
        "200":
          description: The hook.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hook"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      operationId: updateHook
      tags: [delivery]
      summary: Replace a hook
      description: Needs delivery:write. Clients whose grants use it get a revision bump.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HookInput"}
      responses:
        "200":
          description: Updated hook.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hook"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteHook
      tags: [delivery]
      summary: Delete a hook
      description: Needs delivery:write. 409 while any grant uses it; the detail names up to five client/certificate pairs.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /agents/ca:
    get:
      operationId: listAgentCAs
      tags: [agents]
      summary: List agent CAs
      description: Needs global settings:read. Every agent CA with its fingerprint and the number of unexpired active agent certificates it issued, plus the listener certificate.
      responses:
        "200":
          description: CAs, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentCAList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /agents/ca/rotate:
    post:
      operationId: rotateAgentCA
      tags: [agents]
      summary: Rotate the agent CA
      description: Needs global settings:write. Creates a new active CA and marks the previous one retiring; both stay trusted. Online agents receive the new trust bundle; agents move to the new CA as they renew.
      responses:
        "201":
          description: The new active CA.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentCA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /agents/ca/{id}/retire:
    parameters: [{$ref: "#/components/parameters/Id"}]
    post:
      operationId: retireAgentCA
      tags: [agents]
      summary: Retire an agent CA
      description: Needs global settings:write. Stops trusting a retiring CA. 409 for the active CA or while any active, unexpired agent certificate was issued by it.
      responses:
        "200":
          description: The retired CA.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentCA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /users:
    get:
      operationId: listUsers
      tags: [access]
      summary: List users
      description: Every user, local and OIDC. Needs users:read (admin, or org-admin in any org).
      responses:
        "200":
          description: Users sorted by display name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /users/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    patch:
      operationId: updateUser
      tags: [access]
      summary: Enable or disable a user
      description: Needs users:write (global admin). Disabling revokes every session of the user at once and stops API keys they created. You cannot disable yourself (409). Users are never deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [access]
      summary: List API keys
      description: Keys the caller may see; org keys need apikeys:read in that org, global keys need it globally. Secrets are never returned.
      parameters:
        - {name: orgId, in: query, required: false, description: Only keys scoped to this org., schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Keys, newest first, revoked ones included.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKeyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createApiKey
      tags: [access]
      summary: Create an API key
      description: Needs apikeys:write in orgId (globally when omitted) and a signed-in user; keys cannot create keys. Requested scopes are intersected with what the creator may do there; 422 when none remain. The token is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiKeyInput"}
      responses:
        "201":
          description: Created; token shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKeyCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api-keys/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    delete:
      operationId: revokeApiKey
      tags: [access]
      summary: Revoke an API key
      description: Needs apikeys:write in the key's org. Takes effect on the next request; revoking twice is a no-op.
      responses:
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /role-bindings:
    get:
      operationId: listRoleBindings
      tags: [access]
      summary: List role bindings
      description: Bindings the caller may read (bindings:read in the binding's org, or globally for global bindings). Site-scoped bindings are not listed.
      parameters:
        - {name: orgId, in: query, required: false, description: Only bindings scoped to this org., schema: {type: string, format: uuid}}
        - {name: subjectType, in: query, required: false, description: Only this subject type., schema: {$ref: "#/components/schemas/SubjectType"}}
      responses:
        "200":
          description: Bindings, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleBindingList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createRoleBinding
      tags: [access]
      summary: Create a role binding
      description: A user subject needs bindings:write in orgId (globally when omitted), scoped to the org-admin's own org. An apikey subject needs apikeys:write at the key's own scope (global for global keys, the key's org for org-scoped keys) instead. An oidc_group subject always needs global bindings:write, whatever orgId the binding targets (OIDC group mappings are admin-only). A user subject is a user id, an apikey subject a key id (org keys bind only in their own org), an oidc_group subject the group name as the IdP sends it. Takes effect on the subject's next request.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoleBindingInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleBinding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /role-bindings/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    delete:
      operationId: deleteRoleBinding
      tags: [access]
      summary: Delete a role binding
      description: Needs bindings:write in the binding's org (user and oidc_group subjects; oidc_group always globally) or apikeys:write at the key's own scope (apikey subjects). The last global admin binding held by a user cannot be deleted (409).
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events
      description: Newest first, keyset paginated. Needs audit:read.
      parameters:
        - {$ref: "#/components/parameters/AuditFrom"}
        - {$ref: "#/components/parameters/AuditTo"}
        - {$ref: "#/components/parameters/AuditActor"}
        - {$ref: "#/components/parameters/AuditAction"}
        - {$ref: "#/components/parameters/AuditResourceType"}
        - {$ref: "#/components/parameters/AuditResourceId"}
        - {$ref: "#/components/parameters/AuditOrgId"}
        - {$ref: "#/components/parameters/AuditQ"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /audit/{id}:
    parameters:
      - {$ref: "#/components/parameters/AuditEventId"}
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: Get an audit event
      description: Needs audit:read for the event's org, or global audit:read for a null-org event. Answers 404, not 403, when the caller may not see it (same message as a missing id).
      responses:
        "200":
          description: The audit event.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEvent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /audit/export:
    get:
      operationId: exportAuditEvents
      tags: [audit]
      summary: Export audit events as CSV
      description: Same filters as listAuditEvents, newest first, at most 100000 rows. Cells that a spreadsheet would treat as a formula are prefixed with an apostrophe. The X-Audit-Truncated response header is true when the cap was hit; a query error partway through is written as a final "#error,<message>" row instead of truncating the file silently. The export itself is recorded as audit.export. Needs audit:read.
      parameters:
        - {$ref: "#/components/parameters/AuditFrom"}
        - {$ref: "#/components/parameters/AuditTo"}
        - {$ref: "#/components/parameters/AuditActor"}
        - {$ref: "#/components/parameters/AuditAction"}
        - {$ref: "#/components/parameters/AuditResourceType"}
        - {$ref: "#/components/parameters/AuditResourceId"}
        - {$ref: "#/components/parameters/AuditOrgId"}
        - {$ref: "#/components/parameters/AuditQ"}
      responses:
        "200":
          description: CSV with a header row.
          headers:
            Content-Disposition:
              description: Attachment file name.
              schema: {type: string}
            X-Audit-Truncated:
              description: "true when the 100000-row cap was hit; some events are not included."
              schema: {type: boolean}
          content:
            text/csv; charset=utf-8:
              schema: {type: string, format: binary, description: "CSV: id,ts,actor_type,actor_id,actor_name,action,resource_type,resource_id,org_id,ip,details. No BOM."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /audit/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Audit chain status
      description: Walks the whole HMAC chain and reports the first broken row. Cached for 60 seconds. Needs global audit:read (the chain covers every org and global events; an org-scoped auditor gets 403).
      responses:
        "200":
          description: Chain status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditChainStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/flow:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getFlow
      tags: [orgs]
      summary: System map of how certificates connect to issuers, delivery, clients and alerts
      description: >-
        Needs certs:read. Returns five lanes of nodes (issuers, certificates, delivery, clients,
        alerts) and the edges between them. A lane whose resource the caller cannot read
        (cas, accounts or dnscreds:read for issuers, delivery:read, clients:read, alerts:read)
        comes back hidden with no nodes, and edges touching it are dropped. Alert edges are
        inferred from each channel's filters, not recorded, and carry inferred true. At most 500
        nodes; truncated is true when more existed.
      responses:
        "200":
          description: The system map.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Flow"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/channels:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listChannels
      tags: [notifications]
      summary: List notification channels
      description: The org's own channels plus other orgs' allOrgs channels, visible only to a global admin. Needs alerts:read.
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema: {type: array, description: Channels., items: {$ref: "#/components/schemas/Channel"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createChannel
      tags: [notifications]
      summary: Add a notification channel
      description: >-
        Needs alerts:write. config is validated against the notifier's schema from GET
        /meta/schemas notifiers; secret fields (schema secret true) are stored encrypted.
        allOrgs true additionally needs a global admin (403 "all-orgs channels need a global
        admin"). At most 50 channels per org (422). Recorded as channel.create
        {channelId, type, allOrgs} (never config).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/channels/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getChannel
      tags: [notifications]
      summary: Get a notification channel
      description: Secrets are never returned; see storedSecrets. Needs alerts:read.
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      operationId: updateChannel
      tags: [notifications]
      summary: Update a notification channel
      description: >-
        Needs alerts:write. type is immutable (422 "type cannot change"). A secret config field
        sent as __unchanged__ or left out keeps the stored value; changing a readable field a
        secret depends on (for example webhook url, homeassistant baseUrl) while that secret is
        __unchanged__ is 422 "re-enter the secret". allOrgs true additionally needs a global admin
        (403 "all-orgs channels need a global admin"). Recorded as channel.update
        {channelId, type, allOrgs} (never config).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteChannel
      tags: [notifications]
      summary: Delete a notification channel
      description: Needs alerts:write. Recorded as channel.delete {channelId, type, allOrgs}.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: testChannel
      tags: [notifications]
      summary: Send a test notification
      description: >-
        Needs alerts:write. Sends a kind test event to this channel only, inline, bounded to 10
        seconds; allowed even while the channel is disabled. Recorded as channel.test
        {channelId, type, allOrgs}.
      responses:
        "200":
          description: Delivery result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeliveryResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/monitors:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listMonitors
      tags: [monitoring]
      summary: List external monitors
      description: The org's monitors. Needs alerts:read.
      responses:
        "200":
          description: Monitors.
          content:
            application/json:
              schema: {type: array, description: Monitors., items: {$ref: "#/components/schemas/Monitor"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createMonitor
      tags: [monitoring]
      summary: Add an external monitor
      description: Needs alerts:write. At most 500 monitors per org (422). Recorded as monitor.create {monitorId, host, port}.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MonitorInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Monitor"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/monitors/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getMonitor
      tags: [monitoring]
      summary: Get an external monitor
      description: Needs alerts:read.
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Monitor"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      operationId: updateMonitor
      tags: [monitoring]
      summary: Update an external monitor
      description: >-
        Needs alerts:write. Changing host, port, sni or expectedCertificateId resets state to
        unknown and nextCheckAt to now, so the change is observed on the next scan. Recorded as
        monitor.update {monitorId, host, port}.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MonitorInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Monitor"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteMonitor
      tags: [monitoring]
      summary: Delete an external monitor
      description: Needs alerts:write. Recorded as monitor.delete {monitorId, host, port}.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/monitors/{id}/check:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: checkMonitor
      tags: [monitoring]
      summary: Check a monitor now
      description: Needs alerts:write. Runs the check inline, bounded to 15 seconds, and returns the updated monitor. Recorded as monitor.check {monitorId, host, port}.
      responses:
        "200":
          description: The checked monitor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Monitor"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/events:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listEvents
      tags: [notifications]
      summary: List events
      description: >-
        The org's own events plus global (orgId null) events, newest first, keyset paginated.
        Needs alerts:read. Duplicate conditions are suppressed at emission time, not here, so
        every event returned already passed the server's own dedupe rule (see
        docs/notifications.md#dedupe); this endpoint never de-duplicates on its own.
      parameters:
        - {$ref: "#/components/parameters/EventKindFilter"}
        - {$ref: "#/components/parameters/EventSeverityFilter"}
        - {$ref: "#/components/parameters/EventSince"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /backup:
    post:
      operationId: createBackup
      tags: [backup]
      summary: Create and download a backup
      description: >-
        Needs settings:write. Streams an encrypted archive of the whole database, table by table,
        as it is written. 409 "confirm KEK escrow first" unless the backup section's
        kekEscrowConfirmed is true. Recorded as backup.created {sizeBytes} once streaming
        completes, or backup.failed {error} (system actor) if it fails partway through. Restoring
        is CLI-only: no restore over HTTP; see operations.md#restore.
      responses:
        "200":
          description: The backup archive.
          headers:
            Content-Disposition:
              description: 'attachment; filename="certforge-<yyyymmddThhmmssZ>.cfbak"'
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary, description: Encrypted backup archive (internal/backup.Format).}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /backup/status:
    get:
      operationId: getBackupStatus
      tags: [backup]
      summary: Backup schedule and history
      description: Needs settings:read. The configured schedule, escrow confirmation, and the most recent scheduled or on-demand outcome.
      responses:
        "200":
          description: Backup status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cf_session
      description: Session cookie from POST /auth/login.
    bearerApiKey:
      type: http
      scheme: bearer
      description: "API key: Authorization: Bearer cf_<prefix>_<secret>. No CSRF header needed."
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Org id.
      schema: {type: string, format: uuid}
    Id:
      name: id
      in: path
      required: true
      description: Resource id.
      schema: {type: string, format: uuid}
    VersionId:
      name: vid
      in: path
      required: true
      description: Certificate version id.
      schema: {type: string, format: uuid}
    ListStatus:
      name: status
      in: query
      required: false
      description: Only certificates with this status.
      schema: {type: string, enum: [pending, active, failed, expired, revoked]}
    ListQ:
      name: q
      in: query
      required: false
      description: Case-insensitive substring of the name or any certificate name.
      schema: {type: string}
    ListSort:
      name: sort
      in: query
      required: false
      description: name, notAfter, nextRenewAt or status; prefix - for descending. Default name.
      schema: {type: string}
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 500.
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    ListCursor:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page.
      schema: {type: string}
    AuditFrom: {name: from, in: query, required: false, description: Events at or after this time., schema: {type: string, format: date-time}}
    AuditTo: {name: to, in: query, required: false, description: Events before this time., schema: {type: string, format: date-time}}
    AuditActor: {name: actor, in: query, required: false, description: Actor id (user or API key id)., schema: {type: string}}
    AuditAction: {name: action, in: query, required: false, description: "Exact action, or a prefix ending in a dot (session.).", schema: {type: string}}
    AuditResourceType: {name: resourceType, in: query, required: false, description: Resource type, for example certificate., schema: {type: string}}
    AuditResourceId: {name: resourceId, in: query, required: false, description: Resource id., schema: {type: string}}
    AuditOrgId: {name: orgId, in: query, required: false, description: Only this org's events; omit for every org you can audit (global events need global audit:read)., schema: {type: string, format: uuid}}
    AuditQ: {name: q, in: query, required: false, description: Case-insensitive substring of action, resource, actor, IP or details., schema: {type: string}}
    AuditEventId: {name: id, in: path, required: true, description: Audit event id., schema: {type: integer, format: int64}}
    ClientSite: {name: site, in: query, required: false, description: Only clients at this site., schema: {type: string, format: uuid}}
    ClientStatusFilter: {name: status, in: query, required: false, description: Only clients with this status., schema: {$ref: "#/components/schemas/ClientStatus"}}
    ClientQ: {name: q, in: query, required: false, description: Case-insensitive substring of the client name or reported hostname., schema: {type: string}}
    ClientSort: {name: sort, in: query, required: false, description: "name, lastSeen or status; prefix - for descending. Default name.", schema: {type: string}}
    GrantForce: {name: force, in: query, required: false, description: Hard-delete a removal-pending or still-live grant at once instead of waiting for the agent to confirm the files are gone; audited with forced true., schema: {type: boolean, default: false}}
    EventKindFilter:
      name: kind
      in: query
      required: false
      description: Only these kinds; repeat the parameter for more than one. Omit for every kind.
      schema: {type: array, items: {$ref: "#/components/schemas/EventKind"}}
    EventSeverityFilter:
      name: severity
      in: query
      required: false
      description: Only events at or above this severity.
      schema: {$ref: "#/components/schemas/Severity"}
    EventSince: {name: since, in: query, required: false, description: Only events at or after this time., schema: {type: string, format: date-time}}
  responses:
    BadRequest:
      description: Malformed request, query parameter, or JSON body.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: Not signed in, or the session or API key is invalid, expired, or revoked.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Missing permission, or a session request without a valid X-CSRF-Token.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: No such resource visible to the caller.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Conflicts with current state, for example a duplicate name, existing dependents, or nothing to confirm.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PayloadTooLarge:
      description: Request body exceeds 1 MiB.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnsupportedMediaType:
      description: Request body is not application/json.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnprocessableEntity:
      description: The body parsed but failed validation; the title or detail names the field.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: Too many login attempts from this address.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    BadGateway:
      description: An upstream CA or identity provider rejected the request; detail carries its error.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: Unexpected server error; details are in the server log.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceUnavailable:
      description: Temporarily at capacity.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, sent with content type application/problem+json.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Problem type URI; about:blank for generic HTTP errors.
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
    Org:
      type: object
      description: An organization; most resources are scoped to one.
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
          description: Org id.
        slug:
          type: string
          description: URL-safe identifier, lowercase letters, digits, and hyphens.
        name:
          type: string
          description: Display name.
    OrgList:
      type: object
      description: A list of organizations.
      required: [items]
      properties:
        items:
          type: array
          description: Organizations sorted by name.
          items:
            $ref: "#/components/schemas/Org"
    OrgInput:
      type: object
      description: A new organization.
      required: [slug, name]
      properties:
        slug: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: Permanent URL name; lowercase letters, digits, hyphens; not "all".}
        name: {type: string, minLength: 1, maxLength: 100, description: Display name.}
    OrgUpdate:
      type: object
      description: Changes to an organization. The slug cannot change.
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: New display name.}
        slug: {type: string, description: Optional; must equal the current slug.}
    Site:
      type: object
      description: A location within an org, used as a filter.
      required: [id, orgId, name, createdAt]
      properties:
        id: {type: string, format: uuid, description: Site id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Name, unique in the org.}
        createdAt: {type: string, format: date-time, description: Creation time.}
    SiteInput:
      type: object
      description: A site's name.
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
    SiteList:
      type: object
      description: Sites of an org.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Site"}, description: Sites sorted by name.}
    SchemaEntry:
      type: object
      description: One registered pluggable type.
      required: [code, name, schema]
      properties:
        code:
          type: string
          description: Stable type code, for example cloudflare.
        name:
          type: string
          description: Display name.
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the type's configuration. Fields with secret true are write-only. DNS provider schemas may carry x-auth-methods (the alternative credential sets, one of which must be complete) and x-alias-of (on an alias property, naming the canonical key it is folded into).
        aliases:
          type: array
          description: Other codes that select this type; used by search.
          items:
            type: string
        runsOn: {allOf: [{$ref: "#/components/schemas/TargetRunsOn"}], description: "Where this type runs; deploy targets only."}
        keyPolicy: {allOf: [{$ref: "#/components/schemas/KeyPolicy"}], description: "Whether this type ever needs the certificate's private key; deploy targets only."}
    MetaSchemas:
      type: object
      description: Pluggable type schemas grouped by kind.
      required: [dnsProviders, deployTargets, notifiers, signers]
      properties:
        dnsProviders:
          type: array
          description: DNS-01 providers.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        deployTargets:
          type: array
          description: Deploy targets.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        notifiers:
          type: array
          description: Notification channels.
          items:
            $ref: "#/components/schemas/SchemaEntry"
        signers:
          type: array
          description: Private CA signers.
          items:
            $ref: "#/components/schemas/SchemaEntry"
    LoginRequest:
      type: object
      description: Local admin credentials.
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Local admin password.
    AuthMethods:
      type: object
      description: Sign-in methods offered on the login page.
      required: [oidcEnabled, localEnabled, oidcCallbackUrl]
      properties:
        oidcEnabled: {type: boolean, description: Single sign-on is enabled and configured.}
        localEnabled: {type: boolean, description: A local (break-glass) admin exists.}
        oidcCallbackUrl: {type: string, description: "The redirect URI to register for the CertForge client at the identity provider: the effective base URL plus /api/v1/auth/oidc/callback."}
    AuthenticationTestRequest:
      type: object
      description: The issuer to test, usually the unsaved value from the form.
      required: [issuer]
      properties:
        issuer: {type: string, description: OIDC issuer URL.}
    AuthenticationTestResult:
      type: object
      description: Result of fetching discovery and JWKS.
      required: [ok]
      properties:
        ok: {type: boolean, description: Discovery and JWKS were fetched and the JWKS has at least one key.}
        detail: {type: string, description: Why the test failed.}
        authorizationEndpoint: {type: string, description: Authorization endpoint from discovery.}
        tokenEndpoint: {type: string, description: Token endpoint from discovery.}
        keys: {type: integer, description: Number of signing keys in the JWKS.}
    User:
      type: object
      description: A CertForge user.
      required: [id, displayName, localAdmin]
      properties:
        id:
          type: string
          format: uuid
          description: User id.
        displayName:
          type: string
          description: Name shown in the UI.
        localAdmin:
          type: boolean
          description: True for the break-glass local admin.
    Role:
      type: string
      enum: [admin, org-admin, operator, viewer, auditor]
      description: A role. admin is everything; org-admin everything in its org except global-only actions; operator certificates, credentials, accounts, clients, issue and renew; viewer read-only; auditor viewer plus the audit log.
    MeBinding:
      type: object
      description: One role held by the signed-in principal.
      required: [role, orgId]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        orgId:
          type: string
          format: uuid
          nullable: true
          description: The org the role applies to; null for a global binding.
    Me:
      type: object
      description: The signed-in principal.
      required: [user, roles, bindings, orgs, csrfToken]
      properties:
        user:
          description: The signed-in user.
          allOf:
            - $ref: "#/components/schemas/User"
        roles:
          type: array
          description: Distinct role names bound to the user.
          items:
            type: string
        bindings:
          type: array
          description: The roles behind `roles`, with their scope. The UI mirrors authz.Can from these.
          items: {$ref: "#/components/schemas/MeBinding"}
        orgs:
          type: array
          description: Orgs the user can see.
          items:
            $ref: "#/components/schemas/Org"
        csrfToken:
          type: string
          description: Send in the X-CSRF-Token header on every POST, PUT, PATCH, and DELETE.
    SettingsValue:
      type: object
      additionalProperties: true
      description: A settings section value; its shape is defined by the section schema.
    SettingsSection:
      type: object
      description: A settings section with its schema.
      required: [section, schema, value, stored, storedSecrets]
      properties:
        section:
          type: string
          description: Section name.
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) of the value; the UI renders the form from it.
        value:
          description: The section's effective value — its own stored value, or the section's built-in default when it has never been saved. Secret properties are never included here.
          allOf:
            - $ref: "#/components/schemas/SettingsValue"
        stored:
          description: The raw value actually saved for this section, before built-in defaults are filled in; null when the section has never been saved. Lets a client tell "never configured" apart from "explicitly set to the built-in value" (value alone cannot, since it always looks concrete once a default is filled in). Secret properties are never included here.
          allOf:
            - $ref: "#/components/schemas/SettingsValue"
          nullable: true
        storedSecrets:
          type: array
          description: Names of the section's secret properties that currently hold a value. Secret values are never returned; send "__unchanged__" to keep one, "" to clear it.
          items: {type: string}
    VaultSettings:
      type: object
      description: The vault global settings section — how CertForge reaches Vault (or OpenBao); served by GET/PUT /settings/vault.
      properties:
        address: {type: string, format: uri, description: "Vault's base URL (http or https). Required once any other field below is set."}
        namespace: {type: string, maxLength: 128, description: Vault Enterprise namespace; empty for open-source Vault or OpenBao.}
        authMethod: {type: string, enum: [token, approle], default: token, description: How CertForge logs in to Vault.}
        token: {type: string, writeOnly: true, description: "Vault token, used when authMethod is token. Secret: __unchanged__ or omitted keeps the stored value, empty string clears it."}
        roleId: {type: string, maxLength: 128, description: AppRole role id, used when authMethod is approle.}
        secretId: {type: string, writeOnly: true, description: "AppRole secret id, used when authMethod is approle. Secret: __unchanged__ or omitted keeps the stored value, empty string clears it."}
        caPem: {type: string, maxLength: 65536, description: Additional PEM-encoded certificates trusted for Vault's TLS, appended to the system root pool.}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 60, default: 10, description: Per-request timeout for calls to Vault.}
    VaultTestResult:
      type: object
      description: Result of testVaultSettings.
      required: [ok]
      properties:
        ok: {type: boolean, description: Vault answered and login succeeded.}
        tokenTtlSeconds: {type: integer, description: Remaining lifetime of the resulting token, in seconds.}
        policies: {type: array, items: {type: string}, description: Policies attached to the resulting token.}
        version: {type: string, description: Vault's reported server version.}
        error: {type: string, description: Why the test failed, with any secret redacted.}
    KekKind:
      type: string
      enum: [static, vault-transit]
      description: How the key-encryption key is held — a static configured key, or Vault's Transit secrets engine.
    KekRef:
      type: object
      description: One key-encryption key's identity, without its key material.
      required: [kind, kekId]
      properties:
        kind: {$ref: "#/components/schemas/KekKind"}
        kekId: {type: string, description: Opaque id identifying this KEK, stable across restarts.}
    RewrapTable:
      type: string
      enum: [settings, cas, acme_accounts, dns_provider_credentials, output_specs, agent_cas, certificate_versions, notification_channels, deploy_targets]
      description: A table rewrapped by startRewrap, in this visit order; cas covers both eab_hmac and secret_cfg, counted together. notification_channels (Phase 6A) covers secret_cfg and is walked before deploy_targets; deploy_targets (Phase 7A) covers its own secret_cfg and is walked last.
    RewrapTableStatus:
      type: object
      description: Rewrap progress for one table.
      required: [table, scanned, rewrapped, remaining]
      properties:
        table: {$ref: "#/components/schemas/RewrapTable"}
        scanned: {type: integer, format: int64, description: Rows scanned so far.}
        rewrapped: {type: integer, format: int64, description: Rows successfully re-encrypted under the active KEK.}
        remaining: {type: integer, format: int64, description: Rows of this table not yet rewrapped.}
    RewrapStatus:
      type: object
      description: A rewrap run's progress, from startRewrap to completion.
      required: [running, startedAt, finishedAt, activeKekId, previousKekIds, tables, remaining, error]
      properties:
        running: {type: boolean, description: A rewrap is in progress now.}
        startedAt: {type: string, format: date-time, description: When this rewrap started.}
        finishedAt: {type: string, format: date-time, nullable: true, description: When it finished; null while running.}
        activeKekId: {type: string, description: KEK every row is being rewrapped to.}
        previousKekIds: {type: array, items: {type: string}, description: KEKs rows may still be wrapped under.}
        tables: {type: array, items: {$ref: "#/components/schemas/RewrapTableStatus"}, description: Progress per table, in visit order.}
        remaining: {type: integer, format: int64, description: Total rows remaining across every table.}
        error: {type: string, nullable: true, description: Why the rewrap stopped; null while running or after a clean finish.}
    KeysStatus:
      type: object
      description: The server's key-encryption key and any rewrap in progress.
      required: [kind, kekId, previous, canaryOk, rewrap]
      properties:
        kind: {$ref: "#/components/schemas/KekKind"}
        kekId: {type: string, description: Opaque id of the active KEK.}
        vaultAddress: {type: string, format: uri, description: Vault address in use; present only when kind is vault-transit.}
        previous: {type: array, items: {$ref: "#/components/schemas/KekRef"}, description: Previous KEKs still configured to decrypt old data.}
        canaryOk: {type: boolean, description: A round-trip encrypt/decrypt against the active KEK just succeeded.}
        rewrap:
          description: The most recent rewrap, running or finished; null if one has never run.
          allOf:
            - $ref: "#/components/schemas/RewrapStatus"
          nullable: true
    SetupStatus:
      type: object
      description: First-run state.
      required: [needsSetup]
      properties:
        needsSetup:
          type: boolean
          description: True until POST /setup/complete succeeds.
    SetupRequest:
      type: object
      description: First-run wizard input.
      required: [adminPassword, orgName, orgSlug, baseUrl]
      properties:
        adminPassword:
          type: string
          format: password
          minLength: 12
          description: New local admin password, at least 12 characters.
        orgName:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the first org.
        orgSlug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          description: URL-safe identifier of the first org.
        baseUrl:
          type: string
          description: Public URL of this CertForge instance, for example https://certs.example.com.
    CAPresetCode:
      type: string
      description: CA preset code; custom takes any directory URL.
      enum: [letsencrypt, letsencrypt-staging, zerossl, buypass, google, sslcom, custom]
    CAPreset:
      type: object
      description: A well-known ACME CA.
      required: [preset, name, directoryUrl, requiresEab]
      properties:
        preset:
          description: Preset code.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        name: {type: string, description: Display name.}
        directoryUrl: {type: string, description: ACME directory URL; empty for custom.}
        requiresEab: {type: boolean, description: The CA needs External Account Binding.}
    CaType:
      type: string
      enum: [acme, localca, vaultpki]
      description: A CA's kind — an external ACME directory, a CertForge-managed private CA, or one backed by Vault's PKI secrets engine.
    LocalCaConfig:
      type: object
      description: Configuration for a localca CA (Deviations R4). Everything here is public except importKeyPem.
      required: [subject]
      properties:
        subject:
          type: object
          description: Root and issuing certificate subject.
          required: [commonName]
          properties:
            commonName: {type: string, minLength: 1, maxLength: 64, description: Common name of the root and issuing certificates.}
            organization: {type: string, maxLength: 64, description: Organization name.}
            country: {type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 country code.}
        keyType:
          description: "Key algorithm for the root and issuing keys: ec256, ec384, rsa2048 or rsa4096 (Deviations R4 reuses KeyType instead of a separate ecdsa-p256-style enum)."
          allOf:
            - $ref: "#/components/schemas/KeyType"
          default: ec256
        rootValidityYears: {type: integer, minimum: 1, maximum: 30, default: 10, description: Root certificate lifetime in years. Immutable after create.}
        issuingValidityYears: {type: integer, minimum: 1, maximum: 10, default: 3, description: Issuing certificate lifetime in years. Immutable after create.}
        maxLeafDays: {type: integer, minimum: 1, maximum: 825, default: 397, description: Longest validity this CA will issue a leaf for. Editable after create.}
        crl: {type: boolean, default: true, description: "Publish a CRL for this CA at GET /crl/{caId}.crl. Editable after create."}
        importPem: {type: string, description: "Create only, immutable after: PEM to import instead of generating a root — the issuing certificate followed by its chain (the last certificate is the trust anchor)."}
        importKeyPem: {type: string, writeOnly: true, description: "Create only, immutable after: PEM private key for importPem's issuing certificate. Secret; never returned."}
    VaultPkiConfig:
      type: object
      description: Configuration for a vaultpki CA, backed by Vault's PKI secrets engine.
      required: [role]
      properties:
        mount: {type: string, pattern: "^[A-Za-z0-9_-][A-Za-z0-9_/-]{0,127}$", default: pki, description: Vault PKI secrets engine mount path.}
        role: {type: string, minLength: 1, maxLength: 128, description: Vault PKI role to sign leaves against.}
        ttl: {type: string, example: 2160h, description: "Go duration string for issued leaf validity, 1h to 19800h (825 days); Vault's own role or mount ceiling still applies."}
    CA:
      type: object
      description: A certificate authority — an external ACME directory, or (Phase 5A) a private CA CertForge holds the key material for.
      required: [id, orgId, name, directoryUrl, trustBundlePem, eabKid, hasEab, resolvers, shared, type, config, storedSecrets, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: CA id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        preset:
          description: Preset code; absent for a private CA (localca, vaultpki), which has none.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        directoryUrl: {type: string, description: ACME directory URL; empty for a private CA.}
        trustBundlePem:
          type: string
          description: >-
            Extra PEM roots for a private ACME server (acme), or the CA's own trust anchor for a
            private kind: for localca the root PEM (generated), or for an import the last
            certificate of importPem; for vaultpki the CA certificate read from Vault at create.
        eabKid: {type: string, description: EAB key id; empty when unused.}
        hasEab: {type: boolean, description: An EAB HMAC is stored (it is never returned).}
        resolvers: {type: array, items: {type: string}, description: DNS resolvers (host or host:port) for propagation checks.}
        shared: {type: boolean, description: Reserved for Phase 2 global CAs; false in Phase 1.}
        type: {$ref: "#/components/schemas/CaType"}
        config:
          type: object
          additionalProperties: true
          description: >-
            Kind-specific configuration: {} for acme; LocalCaConfig's fields for localca, plus the
            read-only imported (bool), issuingPem (string), retired (array of {pem, notAfter,
            serial, crlUrl?: uri, same conditions as this CA's own crlUrl} for issuing keys
            retired by a rotation) and revokedCount (int); VaultPkiConfig's fields for vaultpki.
        storedSecrets: {type: array, items: {type: string}, description: "Secret config fields held for this CA, for example importKeyPem."}
        notBefore: {type: string, format: date-time, description: Start of validity of the issuing certificate (localca) or the Vault CA (vaultpki); absent for acme.}
        notAfter: {type: string, format: date-time, description: End of validity of the issuing certificate (localca) or the Vault CA (vaultpki); absent for acme.}
        crlUrl: {type: string, format: uri, description: "This CA's current CRL, at GET /crl/{caId}.crl; present only for a localca CA with crl enabled and general.baseUrl set."}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    CAInput:
      type: object
      description: Fields to create or replace a CA.
      required: [name]
      properties:
        name: {type: string, description: Unique name in the org.}
        type:
          description: 'CA kind, default acme. Immutable after create (422 "type cannot change").'
          allOf:
            - $ref: "#/components/schemas/CaType"
          default: acme
        preset:
          description: Preset code; required for acme, ignored for a private kind.
          allOf:
            - $ref: "#/components/schemas/CAPresetCode"
        directoryUrl: {type: string, description: Required for a custom acme preset; defaults to the preset URL. Ignored for a private kind.}
        trustBundlePem: {type: string, description: Extra PEM roots; acme only.}
        eabKid: {type: string, description: "EAB key id; acme only, 422 on a private kind."}
        eabHmac: {type: string, nullable: true, writeOnly: true, description: "EAB HMAC key (base64url); acme only, 422 on a private kind. Write-only: on update null or __unchanged__ keeps it, empty string removes it."}
        resolvers: {type: array, items: {type: string}, description: DNS resolvers for propagation checks; acme only.}
        config:
          type: object
          additionalProperties: true
          description: >-
            Kind-specific configuration: LocalCaConfig for localca, VaultPkiConfig for vaultpki;
            omitted or {} for acme. For localca, subject, keyType, the validity years and the
            import fields are immutable after create (422); maxLeafDays and crl stay editable.
    AcmeAccount:
      type: object
      description: A registered ACME account; its key never leaves the server.
      required: [id, caId, email, status, registrationUri]
      properties:
        id: {type: string, format: uuid, description: Account id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        caId: {type: string, format: uuid, description: CA the account is registered with.}
        email: {type: string, description: Contact email.}
        status: {type: string, enum: [valid, deactivated], description: Account status.}
        registrationUri: {type: string, description: Account URL (kid) at the CA.}
        createdAt: {type: string, format: date-time, description: Registration time.}
    AcmeAccountInput:
      type: object
      description: Account to register.
      required: [caId, email]
      properties:
        caId: {type: string, format: uuid, description: CA to register with.}
        email: {type: string, description: Contact email.}
    DNSCredential:
      type: object
      description: A DNS provider credential. Secret values are never returned.
      required: [id, name, providerCode, config]
      properties:
        id: {type: string, format: uuid, description: Credential id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        providerCode: {type: string, description: Provider code from GET /meta/schemas dnsProviders.}
        config: {type: object, additionalProperties: {type: string}, description: Non-secret field values.}
        storedSecrets: {type: array, items: {type: string}, description: Secret fields that have a stored value.}
        usedBy: {type: integer, description: Certificates and defaults whose rules reference this credential.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    DNSCredentialInput:
      type: object
      description: A new DNS credential.
      required: [name, providerCode, config]
      properties:
        name: {type: string, description: Unique name in the org.}
        providerCode: {type: string, description: Provider code or alias.}
        config: {type: object, additionalProperties: {type: string}, description: Field values keyed by schema property.}
    DNSCredentialUpdate:
      type: object
      description: Replacement name and config.
      required: [name, config]
      properties:
        name: {type: string, description: Unique name in the org.}
        config: {type: object, additionalProperties: {type: string}, description: Full config; secret fields may be __unchanged__.}
    DNSCredentialTestRequest:
      type: object
      description: Zone to test against.
      required: [zone]
      properties:
        zone: {type: string, example: example.com, description: A zone the credential manages.}
    DNSCredentialRevealRequest:
      type: object
      description: Which stored secret to reveal.
      required: [field]
      properties:
        field: {type: string, maxLength: 128, description: Name of a stored secret field of the credential's provider.}
    DNSCredentialRevealResult:
      type: object
      description: One stored secret in plaintext.
      required: [field, value]
      properties:
        field: {type: string, description: The secret field name.}
        value: {type: string, description: The stored plaintext value.}
    DNSCredentialTestResult:
      type: object
      description: Outcome of a credential test.
      required: [ok, fqdn, durationMs]
      properties:
        ok: {type: boolean, description: The record was created and removed.}
        fqdn: {type: string, description: TXT record name used; empty if the test timed out before it was known.}
        error: {type: string, description: "Provider error when ok is false, with every config value redacted; \"timed out\" past the bounded timeout (cleanup keeps running in the background)."}
        durationMs: {type: integer, description: Test duration in milliseconds.}
    KeyType:
      type: string
      description: Certificate key algorithm.
      enum: [rsa2048, rsa3072, rsa4096, ec256, ec384]
    RenewPolicy:
      type: object
      description: When to renew.
      required: [mode, value, useAri]
      properties:
        mode: {type: string, enum: [days, percent], description: "days: renew value days before expiry. percent: renew when value percent of the lifetime remains."}
        value: {type: integer, minimum: 1, maximum: 365, description: Days (1-365) or percent (1-99).}
        useAri: {type: boolean, description: Use the CA's ACME Renewal Information window when it is earlier.}
    ChallengeVia:
      type: string
      enum: [server, agent]
      description: >-
        Who serves an http-01 challenge: server (this host, at /.well-known/acme-challenge) or
        agent (a client — its own http-01 listener when it has one, otherwise a file written into
        webroot for another web server to serve there; webroot is optional, needed only without a
        listener).
    VerificationRule:
      type: object
      description: How to prove control of the names this rule matches. First match wins.
      required: [match, method]
      properties:
        match: {type: string, example: "*.example.com", description: "* (every name), *.zone (names one label below zone, and *.zone itself), or zone (the zone, its subdomains and wildcards)."}
        method: {type: string, enum: [dns-01, manual-dns, http-01, tls-alpn-01], description: Verification method.}
        dnsCredentialId: {type: string, format: uuid, description: DNS credential; required for dns-01.}
        propagationSeconds: {type: integer, minimum: 0, maximum: 3600, description: Propagation timeout override.}
        resolvers: {type: array, items: {type: string}, description: Resolvers for propagation checks.}
        cnameAliasZone: {type: string, description: Zone that _acme-challenge is CNAMEd into; checked before validation.}
        via: {allOf: [{$ref: "#/components/schemas/ChallengeVia"}], description: "http-01 only; default server. Ignored (cleared) for any other method."}
        clientId: {type: string, format: uuid, description: "Client that serves the challenge; required for tls-alpn-01, or for http-01 with via agent."}
        webroot: {type: string, description: Absolute path on the agent host the challenge file is written under; http-01 via agent only.}
    IssuanceDefaults:
      type: object
      description: One level of issuance settings (org defaults or certificate overrides). Null or omitted inherits from the level above.
      properties:
        caId: {type: string, format: uuid, nullable: true, description: CA.}
        accountId: {type: string, format: uuid, nullable: true, description: ACME account; must belong to the CA.}
        keyType: {allOf: [{$ref: "#/components/schemas/KeyType"}], nullable: true, description: Key algorithm.}
        renewPolicy: {allOf: [{$ref: "#/components/schemas/RenewPolicy"}], nullable: true, description: Renewal policy.}
        preferredChain: {type: string, nullable: true, description: Issuer common name of the preferred alternate chain.}
        reuseKey: {type: boolean, nullable: true, description: Keep the private key across renewals.}
        mustStaple: {type: boolean, nullable: true, description: Request OCSP must-staple.}
        verificationRules: {type: array, nullable: true, items: {$ref: "#/components/schemas/VerificationRule"}, description: Catch-all rules checked after a certificate's own rules.}
        propagationSeconds: {type: integer, nullable: true, minimum: 0, maximum: 3600, description: Propagation timeout in seconds.}
        resolvers: {type: array, nullable: true, items: {type: string}, description: Resolvers for propagation checks.}
    Source:
      type: string
      description: Level an effective value came from; default means the built-in value.
      enum: [default, global, org, cert]
    EffectiveUuid:
      type: object
      description: Effective id and its source.
      required: [source]
      properties:
        value: {type: string, format: uuid, nullable: true, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveString:
      type: object
      description: Effective string and its source.
      required: [value, source]
      properties:
        value: {type: string, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveBool:
      type: object
      description: Effective flag and its source.
      required: [value, source]
      properties:
        value: {type: boolean, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveInt:
      type: object
      description: Effective number and its source.
      required: [value, source]
      properties:
        value: {type: integer, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveStrings:
      type: object
      description: Effective string list and its source.
      required: [value, source]
      properties:
        value: {type: array, items: {type: string}, description: Resolved value.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveRenewPolicy:
      type: object
      description: Effective renewal policy and its source.
      required: [value, source]
      properties:
        value:
          description: Resolved renewal policy.
          allOf:
            - $ref: "#/components/schemas/RenewPolicy"
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveRules:
      type: object
      description: Effective catch-all rules and their source.
      required: [value, source]
      properties:
        value: {type: array, items: {$ref: "#/components/schemas/VerificationRule"}, description: Resolved rules.}
        source:
          description: Level this value came from.
          allOf:
            - $ref: "#/components/schemas/Source"
    EffectiveIssuanceDefaults:
      type: object
      description: Resolved issuance settings, each with the level it came from.
      properties:
        caId:
          description: Resolved CA and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveUuid"
        accountId:
          description: Resolved ACME account and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveUuid"
        keyType:
          description: Resolved key algorithm and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveString"
        renewPolicy:
          description: Resolved renewal policy and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveRenewPolicy"
        preferredChain:
          description: Resolved preferred chain and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveString"
        reuseKey:
          description: Resolved reuse-key flag and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveBool"
        mustStaple:
          description: Resolved must-staple flag and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveBool"
        verificationRules:
          description: Resolved catch-all rules and their source.
          allOf:
            - $ref: "#/components/schemas/EffectiveRules"
        propagationSeconds:
          description: Resolved propagation timeout and its source.
          allOf:
            - $ref: "#/components/schemas/EffectiveInt"
        resolvers:
          description: Resolved resolvers and their source.
          allOf:
            - $ref: "#/components/schemas/EffectiveStrings"
    AriWindow:
      type: object
      description: The CA's cached ACME Renewal Information window for a certificate's current version.
      required: [start, end, checkedAt]
      properties:
        start: {type: string, format: date-time, description: Earliest suggested renewal time.}
        end: {type: string, format: date-time, description: Latest suggested renewal time.}
        checkedAt: {type: string, format: date-time, description: When this window was last fetched from the CA.}
    RevocationReason:
      type: string
      enum: [unspecified, keyCompromise, caCompromise, affiliationChanged, superseded, cessationOfOperation]
      description: RFC 5280 CRL revocation reason code.
    RevokeRequest:
      type: object
      description: Reason to record when revoking a certificate version.
      properties:
        reason:
          description: Reason for the revocation.
          allOf:
            - $ref: "#/components/schemas/RevocationReason"
          default: unspecified
    CertificateVersion:
      type: object
      description: One issued certificate.
      required: [id, serial, notBefore, notAfter, sha256Fingerprint, source, hasKey]
      properties:
        id: {type: string, format: uuid, description: Version id.}
        serial: {type: string, description: Serial number, lower-case hex.}
        notBefore: {type: string, format: date-time, description: Start of validity.}
        notAfter: {type: string, format: date-time, description: End of validity.}
        sha256Fingerprint: {type: string, description: SHA-256 of the leaf DER, lower-case hex.}
        keyType:
          description: Key algorithm.
          allOf:
            - $ref: "#/components/schemas/KeyType"
        source: {type: string, enum: [issued, imported, uploaded], description: How the version was obtained.}
        hasKey: {type: boolean, description: Whether a private key is stored for this version; false for a keyless import or upload.}
        revokedAt: {type: string, format: date-time, nullable: true, description: Revocation time.}
        createdAt: {type: string, format: date-time, description: When it was stored.}
    Certificate:
      type: object
      description: A certificate, managed (issued and renewed by CertForge) or unmanaged (imported or uploaded); see managed.
      required: [id, name, commonName, sans, verificationRules, overrides, status, failureCount, effective, managed]
      properties:
        id: {type: string, format: uuid, description: Certificate id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Unique name in the org.}
        commonName: {type: string, description: First name; the certificate subject.}
        sans: {type: array, items: {type: string}, description: Names besides the common name.}
        verificationRules:
          type: array
          description: Certificate rules, checked before the inherited catch-all rules.
          items: {$ref: "#/components/schemas/VerificationRule"}
        overrides:
          description: Per-certificate overrides of issuance settings.
          allOf:
            - $ref: "#/components/schemas/IssuanceDefaults"
        status: {type: string, enum: [pending, active, failed, expired, revoked], description: "pending until first issued; active while a valid version exists."}
        managed: {type: boolean, description: "false for an imported or uploaded certificate: CertForge tracks it but never renews it, and renew/most edits are refused (409)."}
        currentVersion:
          description: Newest issued version.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CertificateVersion"
        nextRenewAt: {type: string, format: date-time, nullable: true, description: Next scheduled issuance or retry.}
        failureCount: {type: integer, description: Consecutive failed attempts.}
        lastError: {type: string, nullable: true, description: Error of the last failed attempt.}
        effective:
          description: Resolved issuance settings for this certificate.
          allOf:
            - $ref: "#/components/schemas/EffectiveIssuanceDefaults"
        ariWindow:
          description: The CA's cached ACME Renewal Information window, when the CA supports it and one has been fetched.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AriWindow"
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
        grantCount: {type: integer, description: Live grants of this certificate to clients; set on list responses.}
    CertificateInput:
      type: object
      description: Fields to create or replace a certificate.
      required: [name, commonName]
      properties:
        name: {type: string, description: Unique name in the org.}
        commonName: {type: string, description: Common name.}
        sans: {type: array, items: {type: string}, description: More names; the common name may repeat here.}
        verificationRules:
          type: array
          description: Ordered rules.
          items: {$ref: "#/components/schemas/VerificationRule"}
        overrides:
          description: Per-certificate overrides of issuance settings.
          allOf:
            - $ref: "#/components/schemas/IssuanceDefaults"
    CertificateList:
      type: object
      description: One page of certificates.
      required: [items]
      properties:
        items:
          type: array
          description: Certificates.
          items: {$ref: "#/components/schemas/Certificate"}
        nextCursor: {type: string, nullable: true, description: Cursor for the next page; null on the last page.}
    AttemptStep:
      type: object
      description: One step of an attempt.
      required: [name, status, startedAt]
      properties:
        name: {type: string, example: "challenge *.example.com", description: "caa, rate_ledger, account, order, challenge <name>, finalize or store."}
        status: {type: string, enum: [pending, running, success, failed, skipped, waiting_manual], description: Step state.}
        startedAt: {type: string, format: date-time, description: Start time.}
        finishedAt: {type: string, format: date-time, nullable: true, description: End time.}
        message: {type: string, nullable: true, description: Detail or error.}
    IssuanceAttempt:
      type: object
      description: One issuance run.
      required: [id, startedAt, outcome, steps, log]
      properties:
        id: {type: string, format: uuid, description: Attempt id.}
        startedAt: {type: string, format: date-time, description: Start time.}
        finishedAt: {type: string, format: date-time, nullable: true, description: End time.}
        outcome: {type: string, enum: [running, success, failed], description: Result.}
        acmeErrorType: {type: string, nullable: true, example: "urn:ietf:params:acme:error:rateLimited", description: ACME problem type of the failure.}
        retryAfter: {type: string, format: date-time, nullable: true, description: Earliest retry the CA allows.}
        steps:
          type: array
          description: Step timeline.
          items: {$ref: "#/components/schemas/AttemptStep"}
        log: {type: string, description: Attempt log.}
    ManualDNSRecord:
      type: object
      description: A TXT record the operator must add.
      required: [name, type, value, ttl]
      properties:
        name: {type: string, example: _acme-challenge.lab.example.com, description: Record name.}
        type: {type: string, enum: [TXT], description: Record type.}
        value: {type: string, description: Record value.}
        ttl: {type: integer, description: Suggested TTL in seconds.}
        expiresAt: {type: string, format: date-time, description: The attempt fails if not confirmed by then.}
    ManualDNSConfirmResult:
      type: object
      description: Confirmation result.
      required: [confirmed]
      properties:
        confirmed: {type: integer, description: Records confirmed.}
    RenewResult:
      type: object
      description: Renew request result.
      required: [enqueued]
      properties:
        enqueued: {type: boolean, description: False when an issuance was already queued or running.}
    ExportFormat:
      type: string
      enum: [p12, jks]
      description: Export container format.
    ExportRequest:
      type: object
      description: How to package a version's certificate and key for export.
      required: [format, password]
      properties:
        format: {$ref: "#/components/schemas/ExportFormat"}
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Export password; at least 6 characters for jks. Never logged, audited, or returned.
        encoding: {allOf: [{$ref: "#/components/schemas/P12Encoding"}], description: "p12 only; default modern."}
        alias: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$", description: "jks only; default SafeName(cert name)."}
    CertificateUpload:
      type: object
      description: >-
        An existing certificate and (optionally) its key, stored as an unmanaged certificate.
        Exactly one of certificatePem or pkcs12Base64 is required. Recorded as certificate.upload
        in the audit log.
      required: [name]
      properties:
        name: {type: string, description: Unique name in the org.}
        certificatePem: {type: string, description: "PEM leaf certificate, optionally followed by its chain."}
        privateKeyPem: {type: string, writeOnly: true, description: PEM private key matching certificatePem; omit for a keyless certificate.}
        pkcs12Base64: {type: string, writeOnly: true, format: byte, description: "Base64 PKCS#12 bundle (certificate, chain and optionally a key)."}
        password: {type: string, writeOnly: true, description: Password for pkcs12Base64; omit if it has none.}
    CertificateVersionUpload:
      type: object
      description: A version to add to an existing unmanaged certificate; the same shape as CertificateUpload without a name. 409 when the certificate is managed.
      properties:
        certificatePem: {type: string, description: "PEM leaf certificate, optionally followed by its chain."}
        privateKeyPem: {type: string, writeOnly: true, description: PEM private key matching certificatePem; omit for a keyless version.}
        pkcs12Base64: {type: string, writeOnly: true, format: byte, description: "Base64 PKCS#12 bundle (certificate, chain and optionally a key)."}
        password: {type: string, writeOnly: true, description: Password for pkcs12Base64; omit if it has none.}
    ImportSource:
      type: string
      enum: [acmesh, certbot]
      description: Tool whose on-disk layout the archive was detected as.
    ImportAction:
      type: string
      enum: [create, skip]
      description: What importCertificates did or would do with this entry.
    ImportItem:
      type: object
      description: One certificate found in an import archive.
      required: [name, names, notAfter, issuer, hasKey, source, action, reason]
      properties:
        name: {type: string, description: "Certificate name, derived from the archive."}
        names: {type: array, items: {type: string}, description: Common name and SANs.}
        notAfter: {type: string, format: date-time, description: End of validity.}
        issuer: {type: string, description: Issuer common name.}
        hasKey: {type: boolean, description: Whether a private key was found alongside the certificate.}
        source: {$ref: "#/components/schemas/ImportSource"}
        action: {$ref: "#/components/schemas/ImportAction"}
        reason: {type: string, description: "Why: created, or why skipped (for example a name collision)."}
        certificateId: {type: string, format: uuid, description: The stored certificate's id; set when action is create and dryRun is false.}
    ImportResult:
      type: object
      description: Result of importCertificates, or a preview when dryRun is true.
      required: [dryRun, items]
      properties:
        dryRun: {type: boolean, description: True when nothing was stored; items shows what would happen.}
        items: {type: array, items: {$ref: "#/components/schemas/ImportItem"}, description: One entry per certificate found in the archive.}
    RateLimitName:
      type: string
      enum: [certsPerRegisteredDomainPerWeek, duplicateCertsPerWeek, failedValidationsPerHour, newOrdersPer3Hours]
      description: Which of the CA's rate limits this is.
    RateLimits:
      type: object
      description: The CA's own ACME rate limits, enforced locally before the CA rejects a request. 0 means no limit.
      required: [certsPerRegisteredDomainPerWeek, duplicateCertsPerWeek, failedValidationsPerHour, newOrdersPer3Hours]
      properties:
        certsPerRegisteredDomainPerWeek: {type: integer, minimum: 0, maximum: 100000, description: Certificates per registered domain per week.}
        duplicateCertsPerWeek: {type: integer, minimum: 0, maximum: 100000, description: Identical-name-set certificates per week.}
        failedValidationsPerHour: {type: integer, minimum: 0, maximum: 100000, description: Failed challenge validations per registered domain per hour.}
        newOrdersPer3Hours: {type: integer, minimum: 0, maximum: 100000, description: New orders per CA per 3 hours.}
    RateLedgerItem:
      type: object
      description: Current usage of one rate limit, against its window.
      required: [limit, scope, count, max, windowSeconds, resetsAt]
      properties:
        limit: {$ref: "#/components/schemas/RateLimitName"}
        scope: {type: string, description: "What the count is scoped to (a registered domain, joined certificate names, or empty for a per-CA limit)."}
        count: {type: integer, description: Current usage in the window.}
        max: {type: integer, description: The limit; 0 means unlimited.}
        windowSeconds: {type: integer, description: Window length in seconds.}
        resetsAt: {type: string, format: date-time, nullable: true, description: When the oldest counted event leaves the window; null when count is 0.}
    RateLedger:
      type: object
      description: A CA's current rate-limit usage, optionally narrowed to one certificate's duplicate-cert usage.
      required: [caId, enforced, limits, items]
      properties:
        caId: {type: string, format: uuid, description: CA these limits apply to.}
        enforced: {type: boolean, description: "False for a staging CA preset, where the CA itself does not enforce limits."}
        limits: {$ref: "#/components/schemas/RateLimits"}
        items: {type: array, items: {$ref: "#/components/schemas/RateLedgerItem"}, description: One entry per rate limit.}
    UserDetail:
      type: object
      description: A user as shown in Settings → Access.
      required: [id, displayName, email, localAdmin, oidcIssuer, oidcSubject, groups, disabled, lastLogin, createdAt]
      properties:
        id: {type: string, format: uuid, description: User id.}
        displayName: {type: string, description: Name from the identity provider, or "Local admin".}
        email: {type: string, nullable: true, description: Email from the identity provider.}
        localAdmin: {type: boolean, description: True for the break-glass local admin.}
        oidcIssuer: {type: string, nullable: true, description: Issuer that authenticated the user; null for the local admin.}
        oidcSubject: {type: string, nullable: true, description: Subject at the issuer.}
        groups: {type: array, items: {type: string}, description: Groups from the user's last OIDC login.}
        disabled: {type: boolean, description: Disabled users cannot sign in and their API keys stop working.}
        lastLogin: {type: string, format: date-time, nullable: true, description: Last successful sign-in.}
        createdAt: {type: string, format: date-time, description: First sign-in or creation time.}
    UserList:
      type: object
      description: All users.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/UserDetail"}, description: Users sorted by display name.}
    UserUpdate:
      type: object
      description: Changes to a user.
      required: [disabled]
      properties:
        disabled: {type: boolean, description: true disables the user and revokes their sessions.}
    ApiKeyScope:
      type: string
      enum: ["certs:read", "certs:write", "certs:issue", "keys:export", "dnscreds:reveal", "clients:read", "clients:write", "delivery:read", "delivery:write", "alerts:read", "alerts:write", "admin"]
      description: What a key may do. certs:read also reads orgs, sites, CAs, accounts and DNS credentials (without secrets); dnscreds:reveal also reads DNS credentials and may reveal their stored secrets; clients:read also reads orgs and sites; delivery covers layouts, deploy targets and hooks; alerts covers notification channels, events and external monitors; admin is everything.
    ApiKey:
      type: object
      description: An API key without its secret.
      required: [id, name, prefix, scopes, orgId, createdBy, createdByName, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id: {type: string, format: uuid, description: Key id; the audit actor id for its requests.}
        name: {type: string, description: Label chosen at creation.}
        prefix: {type: string, description: "Public part of the token: cf_<prefix>_…"}
        scopes: {type: array, items: {$ref: "#/components/schemas/ApiKeyScope"}, description: Granted scopes after intersection with the creator's role.}
        orgId: {type: string, format: uuid, nullable: true, description: The only org the key can act in; null for all orgs its creator can.}
        createdBy: {type: string, format: uuid, description: Creating user; the key never exceeds their current permissions.}
        createdByName: {type: string, description: Creator's display name.}
        expiresAt: {type: string, format: date-time, nullable: true, description: Expiry; null never expires.}
        lastUsedAt: {type: string, format: date-time, nullable: true, description: Last authenticated use, to the minute.}
        revokedAt: {type: string, format: date-time, nullable: true, description: When the key was revoked.}
        createdAt: {type: string, format: date-time, description: Creation time.}
    ApiKeyInput:
      type: object
      description: A new API key.
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Label.}
        scopes: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ApiKeyScope"}, description: Requested scopes.}
        orgId: {type: string, format: uuid, nullable: true, description: Limit the key to this org.}
        expiresAt: {type: string, format: date-time, nullable: true, description: Expiry, at least one minute ahead; omit for none.}
    ApiKeyCreated:
      type: object
      description: A new key and its token.
      required: [apiKey, token]
      properties:
        apiKey: {$ref: "#/components/schemas/ApiKey"}
        token: {type: string, description: "Bearer token cf_<prefix>_<secret>. Shown once; only its hash is stored."}
    ApiKeyList:
      type: object
      description: API keys.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ApiKey"}, description: Keys, newest first.}
    SubjectType:
      type: string
      enum: [user, oidc_group, apikey]
      description: What a binding's subject names.
    RoleBinding:
      type: object
      description: One role granted to a subject, globally or in one org.
      required: [id, subjectType, subject, subjectLabel, role, orgId, createdAt]
      properties:
        id: {type: string, format: uuid, description: Binding id.}
        subjectType: {$ref: "#/components/schemas/SubjectType"}
        subject: {type: string, description: User id, API key id, or OIDC group name.}
        subjectLabel: {type: string, description: User display name, API key name, or the group name.}
        role: {$ref: "#/components/schemas/Role"}
        orgId: {type: string, format: uuid, nullable: true, description: Org the role applies to; null for global.}
        createdAt: {type: string, format: date-time, description: Creation time.}
    RoleBindingInput:
      type: object
      description: A new role binding.
      required: [subjectType, subject, role]
      properties:
        subjectType: {$ref: "#/components/schemas/SubjectType"}
        subject: {type: string, minLength: 1, maxLength: 256, description: User id, API key id, or OIDC group name.}
        role: {$ref: "#/components/schemas/Role"}
        orgId: {type: string, format: uuid, nullable: true, description: Org scope; omit or null for global.}
    RoleBindingList:
      type: object
      description: Role bindings.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/RoleBinding"}, description: Bindings, oldest first.}
    AuditEvent:
      type: object
      description: One audit log entry.
      required: [id, ts, actorType, actorId, actorName, action, resourceType, resourceId, orgId, ip, details]
      properties:
        id: {type: integer, format: int64, description: Position in the chain.}
        ts: {type: string, format: date-time, description: When it happened.}
        actorType: {type: string, description: "user, apikey, system, or anonymous."}
        actorId: {type: string, description: User or API key id; empty for system.}
        actorName: {type: string, description: User display name or API key name; empty when unknown.}
        action: {type: string, description: "What happened, for example certificate.renew or session.login."}
        resourceType: {type: string, description: Kind of object acted on.}
        resourceId: {type: string, description: Id of the object acted on.}
        orgId: {type: string, format: uuid, nullable: true, description: Org of the object; null for global events.}
        ip: {type: string, description: Client address (trusted-proxy aware).}
        details:
          type: object
          additionalProperties: true
          description: Event specifics. Update events carry before and after objects.
    AuditEventList:
      type: object
      description: One page of audit events.
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}, description: Events, newest first.}
        nextCursor: {type: string, nullable: true, description: Cursor for the next (older) page; null on the last page.}
    AuditChainStatus:
      type: object
      description: Result of verifying the audit chain.
      required: [ok, count, brokenAtId, checkedAt, headHash]
      properties:
        ok: {type: boolean, description: Every row links and verifies.}
        count: {type: integer, format: int64, description: Rows that verified.}
        brokenAtId: {type: integer, format: int64, nullable: true, description: First row that failed; null when ok.}
        checkedAt: {type: string, format: date-time, description: When the walk ran (results are cached 60 s).}
        headHash: {type: string, description: Hex hash of the last verified row.}
    ClientStatus:
      type: string
      enum: [pending, active, revoked]
      description: pending until the agent enrols with its token; revoked clients are refused.
    Client:
      type: object
      description: A host running certforge-agent, enrolled into one org.
      required: [id, orgId, siteId, name, status, connected, online, hostname, os, arch, agentVersion, capabilities, lastSeen, agentCertNotAfter, agentCaId, desiredRevision, appliedRevision, grantCount, driftCount, failedCount, createdAt]
      properties:
        id: {type: string, format: uuid, description: Client id; the audit actor id of its agent.}
        orgId: {type: string, format: uuid, description: Owning org.}
        siteId: {type: string, format: uuid, nullable: true, description: Site the client sits at; a filter only.}
        name: {type: string, description: Name, unique in the org.}
        status: {$ref: "#/components/schemas/ClientStatus"}
        connected: {type: boolean, description: The agent holds an open WebSocket to this server now.}
        online: {type: boolean, description: "connected, or lastSeen within Settings → Agents → offlineAfterSeconds; a pull-only agent is online while it keeps pulling."}
        hostname: {type: string, description: Hostname the agent reported; empty until enrolled.}
        os: {type: string, description: Operating system the agent reported, for example linux.}
        arch: {type: string, description: CPU architecture the agent reported, for example amd64.}
        agentVersion: {type: string, description: certforge-agent version.}
        capabilities: {type: array, items: {type: string}, description: Features the agent advertised, for example traefik and hooks.}
        lastSeen: {type: string, format: date-time, nullable: true, description: Last hello, heartbeat or report (written at most every 10 seconds).}
        agentCertNotAfter: {type: string, format: date-time, nullable: true, description: Expiry of the agent's client certificate; the agent renews at two thirds of its lifetime.}
        agentCaId: {type: string, format: uuid, nullable: true, description: Agent CA that signed the client's current certificate; null until enrolled.}
        desiredRevision: {type: integer, format: int64, description: Bumped by every grant, layout, target, hook or certificate version change affecting this client.}
        appliedRevision: {type: integer, format: int64, description: Highest revision the agent has reported applying.}
        grantCount: {type: integer, description: Live grants.}
        driftCount: {type: integer, description: Grants whose deployment is in drift.}
        failedCount: {type: integer, description: Grants whose last deployment failed.}
        tokenExpiresAt: {type: string, format: date-time, nullable: true, description: Expiry of the unused enrolment token while pending.}
        createdAt: {type: string, format: date-time, description: Creation time.}
    ClientInput:
      type: object
      description: A new client.
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
        siteId: {type: string, format: uuid, nullable: true, description: Optional site in the same org.}
    ClientUpdate:
      type: object
      description: A client's editable fields; both are always sent.
      required: [name, siteId]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
        siteId: {type: string, format: uuid, nullable: true, description: Site in the same org; null clears it.}
    ClientCreated:
      type: object
      description: A pending client and its one-time enrolment token.
      required: [client, token, expiresAt, agentUrl]
      properties:
        client: {$ref: "#/components/schemas/Client"}
        token: {type: string, description: "Enrolment token cf1.<agent URL>.<CA fingerprint>.<secret>. Shown once; only its hash is stored."}
        expiresAt: {type: string, format: date-time, description: When the token stops working.}
        agentUrl: {type: string, description: Agent listener URL the token points at.}
    ClientList:
      type: object
      description: One page of clients.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Client"}, description: Clients.}
        nextCursor: {type: string, nullable: true, description: Cursor for the next page; null on the last page.}
    AgentCAStatus:
      type: string
      enum: [active, retiring, retired]
      description: active signs new agent certificates; retiring is still trusted; retired is not.
    AgentCA:
      type: object
      description: One internal agent CA.
      required: [id, status, fingerprint, subject, notBefore, notAfter, activeClientCerts, createdAt]
      properties:
        id: {type: string, format: uuid, description: CA id.}
        status: {$ref: "#/components/schemas/AgentCAStatus"}
        fingerprint: {type: string, description: Lowercase hex SHA-256 of the CA certificate; enrolment tokens pin it.}
        subject: {type: string, description: Certificate subject common name.}
        notBefore: {type: string, format: date-time, description: Start of validity.}
        notAfter: {type: string, format: date-time, description: End of validity.}
        activeClientCerts: {type: integer, description: Unexpired certificates of active clients issued by this CA.}
        createdAt: {type: string, format: date-time, description: Creation time.}
    AgentListener:
      type: object
      description: The agent listener's current server certificate.
      required: [caId, names, notAfter]
      properties:
        caId: {type: string, format: uuid, nullable: true, description: CA that issued it; null while the listener is not running.}
        names: {type: array, items: {type: string}, description: DNS names and IPs it covers.}
        notAfter: {type: string, format: date-time, nullable: true, description: Expiry; re-issued automatically at two thirds.}
    AgentCAList:
      type: object
      description: Agent CAs and the listener certificate.
      required: [items, listener]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentCA"}, description: CAs, newest first.}
        listener: {$ref: "#/components/schemas/AgentListener"}
    OutputFormat:
      type: string
      enum: [pem, der, p12, jks]
      description: File format.
    OutputPart:
      type: string
      enum: [cert, chain, fullchain, key, combined, extra]
      description: PEM part; a file concatenates its parts in order. extra (PEM only) is the leaf and chain of each of the layout's extra certificates, in order.
    P12Encoding:
      type: string
      enum: [modern, legacy]
      description: PKCS#12 encryption; modern (AES) or legacy (RC2/3DES, for old consumers).
    OutputFile:
      type: object
      description: One file of a layout, written on the agent host.
      required: [path, format, parts, owner, group, mode]
      properties:
        path: {type: string, description: Absolute clean path on the agent host.}
        format: {$ref: "#/components/schemas/OutputFormat"}
        parts: {type: array, items: {$ref: "#/components/schemas/OutputPart"}, description: "Parts concatenated into the file. PEM needs at least one; a DER file holds exactly one (cert or key; chain is download-only); p12 and jks files take no parts."}
        owner: {type: string, description: User name or numeric uid; empty keeps the agent's user. Applied only when the agent runs as root.}
        group: {type: string, description: Group name or numeric gid; empty keeps the agent's group.}
        mode: {type: string, pattern: "^0?[0-7]{3}$", description: Octal permissions, for example 0640.}
        encoding: {allOf: [{$ref: "#/components/schemas/P12Encoding"}], description: "p12 only; default modern."}
        alias: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$", description: "jks only; default the layout's SafeName(cert name)."}
    Layout:
      type: object
      description: An output layout (files built from PEM parts).
      required: [id, orgId, name, files, grantCount, createdAt, updatedAt, passwordSet, extraCertificateIds]
      properties:
        id: {type: string, format: uuid, description: Layout id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Name, unique in the org.}
        files: {type: array, items: {$ref: "#/components/schemas/OutputFile"}, description: Files in write order.}
        grantCount: {type: integer, description: Live grants using it.}
        passwordSet: {type: boolean, description: Whether an export password is stored for this layout's p12/jks files; the password itself is never returned.}
        extraCertificateIds: {type: array, items: {type: string, format: uuid}, description: "Extra certificates this layout bundles alongside its own, rendered as the extra part."}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    LayoutInput:
      type: object
      description: A layout's name and files.
      required: [name, files]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
        files: {type: array, minItems: 1, maxItems: 20, items: {$ref: "#/components/schemas/OutputFile"}, description: Files in write order; paths are unique.}
        password:
          type: string
          maxLength: 128
          writeOnly: true
          description: >-
            Export password for this layout's p12/jks files. "__unchanged__" keeps the stored
            value on update (422 on create, since there is nothing to keep); omitted or "" clears
            it; any other string replaces it. Required when any file is p12 or jks; must be at
            least 6 characters when any file is jks.
        extraCertificateIds:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
          description: Extra certificates to bundle alongside this layout's own, rendered as the extra part; must be in the same org, each with a current version.
    LayoutList:
      type: object
      description: An org's layouts.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Layout"}, description: Layouts sorted by name.}
    DeployTargetType:
      type: string
      enum: [traefik, vault-kv]
      description: Deploy target type; the server's registry is authoritative, and its config schema and runsOn/keyPolicy are in GET /meta/schemas under deployTargets — this enum lists only the types shipped today.
    RunsOn:
      type: string
      enum: [agent, server]
      description: Where the target (and its grants) run — an enrolled agent, or this server (a server-side deploy target such as vault-kv).
    TargetRunsOn:
      type: string
      enum: [server, agent, either]
      description: Where a deploy target type runs — always the server, always an agent, or either (the operator chooses at create time).
    KeyPolicy:
      type: string
      enum: [never, optional, always]
      description: Whether a deploy target type ever needs the certificate's private key — never, only when its own config asks for it (includeKey), or always.
    DeployTarget:
      type: object
      description: A deploy target the agent (or the server itself) drives after writing a grant's files.
      required: [id, orgId, name, type, runsOn, config, storedSecrets, grantCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Target id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Name, unique in the org.}
        type: {$ref: "#/components/schemas/DeployTargetType"}
        runsOn: {$ref: "#/components/schemas/RunsOn"}
        config: {type: object, additionalProperties: true, description: Type-specific configuration, valid against the type's schema, with secret fields removed.}
        storedSecrets: {type: array, items: {type: string}, description: Secret fields that have a stored value.}
        grantCount: {type: integer, description: Live grants using it.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    DeployTargetInput:
      type: object
      description: >-
        A target's name, type, runsOn and configuration. A secret field of config sent as
        __unchanged__, or omitted entirely, keeps its stored value; an explicit "" clears it
        (a required secret cleared this way is 422). Changing a URL while a secret is kept
        (reused) needs every secret re-entered (422 "re-enter the secret").
        Every URL in config is checked against the URL policy (loopback/link-local allowed on
        an agent target, gated by the server's allowLoopbackUrls setting on a server target).
        A server target whose config needs the certificate's private key needs keys:export.
      required: [name, type, config]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
        type: {$ref: "#/components/schemas/DeployTargetType"}
        runsOn: {allOf: [{$ref: "#/components/schemas/RunsOn"}], description: "Required for a type whose own runsOn is either; optional and must match otherwise. Immutable after create."}
        config: {type: object, additionalProperties: true, description: Configuration valid against the type's schema.}
    DeployTargetList:
      type: object
      description: An org's deploy targets.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DeployTarget"}, description: Targets sorted by name.}
    HookPhase:
      type: string
      enum: [pre_deploy, post_deploy]
      description: pre_deploy runs before files are written (a failure stops the deploy); post_deploy runs after.
    Hook:
      type: object
      description: A command an agent runs around a deploy, only if its argv[0] is in the agent's CF_HOOK_ALLOW.
      required: [id, orgId, name, phase, argv, timeoutSeconds, grantCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Hook id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, description: Name, unique in the org.}
        phase: {$ref: "#/components/schemas/HookPhase"}
        argv: {type: array, items: {type: string}, description: Executable path and arguments; never run through a shell.}
        timeoutSeconds: {type: integer, description: The process group is killed after this long.}
        grantCount: {type: integer, description: Live grants using it.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    HookInput:
      type: object
      description: A hook's definition.
      required: [name, phase, argv]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Name, unique in the org.}
        phase: {$ref: "#/components/schemas/HookPhase"}
        argv: {type: array, minItems: 1, maxItems: 64, items: {type: string}, description: Absolute executable path, then arguments.}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 3600, default: 60, description: Seconds before the hook is killed.}
    HookList:
      type: object
      description: An org's hooks.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Hook"}, description: Hooks sorted by name.}
    GrantDelivery:
      type: string
      enum: [push, pull]
      description: push nudges the agent over its socket on every change; pull waits for the agent's own schedule or a manual certforge-agent pull.
    DeploymentState:
      type: string
      enum: [pending, ok, failed, drift]
      description: pending until the agent reports the current version; drift when installed files differ from what was deployed.
    FileDigest:
      type: object
      description: A path and the SHA-256 of its content.
      required: [path, sha256]
      properties:
        path: {type: string, description: Absolute path on the agent host.}
        sha256: {type: string, description: Lowercase hex SHA-256; empty for a missing file.}
    Deployment:
      type: object
      description: What a grant should have installed and what the agent last reported.
      required: [state, versionId, expected, installed, error, reportedAt, updatedAt]
      properties:
        state: {$ref: "#/components/schemas/DeploymentState"}
        versionId: {type: string, format: uuid, nullable: true, description: Certificate version being deployed; null until the certificate is first issued.}
        expected: {type: array, items: {$ref: "#/components/schemas/FileDigest"}, description: Files and digests the server rendered for this version.}
        installed: {type: array, items: {$ref: "#/components/schemas/FileDigest"}, description: Files and digests the agent last reported.}
        error: {type: string, description: The agent's error for a failed deployment; empty otherwise.}
        reportedAt: {type: string, format: date-time, nullable: true, description: Last report or heartbeat that changed the state.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    Grant:
      type: object
      description: A certificate granted to a client (runsOn agent) or a server-side deploy target (runsOn server), with how it is delivered.
      required: [id, clientId, clientName, certificateId, certificateName, delivery, layoutId, deployTargetId, hookIds, autoRemediate, deployment, runsOn, serverDeployment, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Grant id.}
        clientId: {type: string, format: uuid, nullable: true, description: Client; null for a server grant.}
        clientName: {type: string, nullable: true, description: Client name; null for a server grant.}
        certificateId: {type: string, format: uuid, description: Certificate.}
        certificateName: {type: string, description: Certificate name.}
        delivery: {$ref: "#/components/schemas/GrantDelivery"}
        layoutId: {type: string, format: uuid, nullable: true, description: Output layout; null for a target-only grant.}
        deployTargetId: {type: string, format: uuid, nullable: true, description: Deploy target; null for files only.}
        hookIds: {type: array, items: {type: string, format: uuid}, description: Hooks in run order.}
        autoRemediate: {type: boolean, description: On drift, bump the revision so the agent reinstalls.}
        deployment:
          description: Agent-side deployment state; null for a server grant (see serverDeployment).
          allOf:
            - $ref: "#/components/schemas/Deployment"
          nullable: true
        runsOn: {$ref: "#/components/schemas/RunsOn"}
        serverDeployment:
          description: Server-side deployment state; null for an agent grant (see deployment).
          allOf:
            - $ref: "#/components/schemas/ServerDeployment"
          nullable: true
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    GrantInput:
      type: object
      description: A new grant; a layout or a deploy target is required.
      required: [certificateId, delivery]
      properties:
        certificateId: {type: string, format: uuid, description: Certificate in the client's org.}
        delivery: {$ref: "#/components/schemas/GrantDelivery"}
        layoutId: {type: string, format: uuid, nullable: true, description: Output layout in the same org.}
        deployTargetId: {type: string, format: uuid, nullable: true, description: Deploy target in the same org.}
        hookIds: {type: array, maxItems: 16, items: {type: string, format: uuid}, description: Hooks in the same org, in run order.}
        autoRemediate: {type: boolean, default: false, description: Reinstall automatically on drift.}
    GrantUpdate:
      type: object
      description: A grant's replaceable fields; all are sent.
      required: [delivery, layoutId, deployTargetId, hookIds, autoRemediate]
      properties:
        delivery: {$ref: "#/components/schemas/GrantDelivery"}
        layoutId: {type: string, format: uuid, nullable: true, description: Output layout in the same org.}
        deployTargetId: {type: string, format: uuid, nullable: true, description: Deploy target in the same org.}
        hookIds: {type: array, maxItems: 16, items: {type: string, format: uuid}, description: Hooks in run order.}
        autoRemediate: {type: boolean, description: Reinstall automatically on drift.}
    GrantList:
      type: object
      description: A client's live grants.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Grant"}, description: Grants sorted by certificate name.}
    ServerGrantInput:
      type: object
      description: A new grant on a server-side deploy target.
      required: [certificateId]
      properties:
        certificateId: {type: string, format: uuid, description: Certificate in the target's org.}
        layoutId: {type: string, format: uuid, nullable: true, description: Output layout in the same org, for a target that renders files from a layout.}
    ServerDeploymentStatus:
      type: string
      enum: [pending, deployed, failed]
      description: A server grant's deploy state.
    ServerDeployment:
      type: object
      description: A server grant's deployment state, in place of the agent-side Deployment.
      required: [status, versionId, lastError, deployedAt, updatedAt]
      properties:
        status: {$ref: "#/components/schemas/ServerDeploymentStatus"}
        versionId: {type: string, format: uuid, nullable: true, description: Certificate version deployed or being deployed; null until the certificate is first issued.}
        lastError: {type: string, nullable: true, maxLength: 1000, description: The last deploy error, scrubbed of any secret; null after a clean deploy.}
        deployedAt: {type: string, format: date-time, nullable: true, description: When status last became deployed.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    CertificateDeployment:
      type: object
      description: One client's deployment of a certificate.
      required: [grantId, clientId, clientName, clientStatus, clientConnected, clientOnline, siteId, delivery, layoutId, layoutName, deployTargetId, deployTargetName, deployment]
      properties:
        grantId: {type: string, format: uuid, description: Grant.}
        clientId: {type: string, format: uuid, description: Client.}
        clientName: {type: string, description: Client name.}
        clientStatus: {$ref: "#/components/schemas/ClientStatus"}
        clientConnected: {type: boolean, description: The client's agent is connected now.}
        clientOnline: {type: boolean, description: The client is online (Client.online).}
        siteId: {type: string, format: uuid, nullable: true, description: The client's site.}
        delivery: {$ref: "#/components/schemas/GrantDelivery"}
        layoutId: {type: string, format: uuid, nullable: true, description: The grant's file layout; null for a Traefik-only grant.}
        layoutName: {type: string, nullable: true, description: The layout's name.}
        deployTargetId: {type: string, format: uuid, nullable: true, description: The grant's deploy target, if any.}
        deployTargetName: {type: string, nullable: true, description: The deploy target's name.}
        deployment: {$ref: "#/components/schemas/Deployment"}
    CertificateDeploymentList:
      type: object
      description: A certificate's deployments.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CertificateDeployment"}, description: Deployments sorted by client name.}
    HookRun:
      type: object
      description: One hook execution an agent reported.
      required: [id, grantId, hookId, hookName, phase, argv, exitCode, durationMs, stdout, stderr, ranAt]
      properties:
        id: {type: string, format: uuid, description: Run id.}
        grantId: {type: string, format: uuid, nullable: true, description: Grant; null once the grant is gone.}
        hookId: {type: string, format: uuid, nullable: true, description: Hook; null once the hook is gone.}
        hookName: {type: string, description: Hook name; empty once the hook is gone.}
        phase: {$ref: "#/components/schemas/HookPhase"}
        argv: {type: array, items: {type: string}, description: Command that ran.}
        exitCode: {type: integer, description: Exit status; -1 when it was not allowed, failed to start or timed out.}
        durationMs: {type: integer, format: int64, description: Wall time in milliseconds.}
        stdout: {type: string, description: Standard output, capped at 8 KiB.}
        stderr: {type: string, description: Standard error, capped at 8 KiB.}
        ranAt: {type: string, format: date-time, description: When the server recorded it.}
    HookRunList:
      type: object
      description: One page of hook runs.
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/HookRun"}, description: Runs, newest first.}
        nextCursor: {type: string, nullable: true, description: Cursor for the next page; null on the last page.}
    ChannelType:
      type: string
      enum: [webhook, smtp, discord, ntfy, homeassistant]
      description: Notification channel kind; matches a code from GET /meta/schemas notifiers. Immutable after create.
    DeliveryStatus:
      type: string
      enum: [pending, delivered, failed]
      description: Outcome of one delivery attempt to one channel.
    ChannelLastDelivery:
      type: object
      description: A channel's most recent delivery attempt, across every event.
      required: [status, at]
      properties:
        status: {$ref: "#/components/schemas/DeliveryStatus"}
        at: {type: string, format: date-time, description: When the attempt finished.}
        error: {type: string, maxLength: 1000, description: Why it failed; absent on success. Redacted of every secret value.}
    FlowStatus:
      type: string
      description: Health of a node or edge.
      enum: [valid, expiring, expired, failed, drift, pending, idle]
    FlowNode:
      type: object
      description: One box on the system map.
      required: [id, kind, name, status, href]
      properties:
        id: {type: string, description: "Stable node id, kind:uuid."}
        kind:
          type: string
          description: What the node is.
          enum: [ca, account, dnsCredential, certificate, layout, target, hook, client, channel]
        name: {type: string, description: Display name.}
        status: {$ref: "#/components/schemas/FlowStatus"}
        statusDetail: {type: string, description: Short reason for the status; absent when there is nothing to add.}
        href: {type: string, description: Web UI path to the resource.}
    FlowLane:
      type: object
      description: One column of the map.
      required: [hidden, nodes]
      properties:
        hidden: {type: boolean, description: True when the caller lacks read permission for this lane; nodes is then empty.}
        nodes:
          type: array
          description: Nodes in the lane.
          items: {$ref: "#/components/schemas/FlowNode"}
    FlowEdge:
      type: object
      description: A connection between two nodes.
      required: [from, to, status, inferred]
      properties:
        from: {type: string, description: Source node id.}
        to: {type: string, description: Target node id.}
        status: {$ref: "#/components/schemas/FlowStatus"}
        inferred: {type: boolean, description: True when the link is derived from channel filters rather than recorded configuration.}
    FlowLanes:
      type: object
      description: The five lanes, left to right.
      required: [issuers, certificates, delivery, clients, alerts]
      properties:
        issuers: {$ref: "#/components/schemas/FlowLane"}
        certificates: {$ref: "#/components/schemas/FlowLane"}
        delivery: {$ref: "#/components/schemas/FlowLane"}
        clients: {$ref: "#/components/schemas/FlowLane"}
        alerts: {$ref: "#/components/schemas/FlowLane"}
    Flow:
      type: object
      description: The system map of an org.
      required: [lanes, edges, truncated, generatedAt]
      properties:
        lanes: {$ref: "#/components/schemas/FlowLanes"}
        edges:
          type: array
          description: Connections between nodes.
          items: {$ref: "#/components/schemas/FlowEdge"}
        truncated: {type: boolean, description: True when the node or edge cap cut the map short.}
        generatedAt: {type: string, format: date-time, description: When the map was built.}
    Channel:
      type: object
      description: A configured notification channel (Shared contracts, Channel schema).
      required: [id, orgId, name, type, summary, config, storedSecrets, events, minSeverity, allOrgs, enabled, lastDelivery, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Channel id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, minLength: 1, maxLength: 100, description: Unique name in the org.}
        type: {$ref: "#/components/schemas/ChannelType"}
        summary: {type: string, maxLength: 200, description: "non-secret display line computed by the server"}
        config: {type: object, additionalProperties: true, description: Non-secret notifier config fields (from GET /meta/schemas notifiers), for example webhook headers or ntfy topic.}
        storedSecrets: {type: array, items: {type: string}, description: Secret config fields held for this channel, for example url or token.}
        events: {type: array, items: {$ref: "#/components/schemas/EventKind"}, description: Kinds this channel receives; empty means every kind.}
        minSeverity: {$ref: "#/components/schemas/Severity"}
        allOrgs: {type: boolean, description: Also receives every other org's matching events. Global-admin only.}
        enabled: {type: boolean, description: Delivers events; a disabled channel can still be tested.}
        lastDelivery:
          description: The channel's most recent delivery attempt; null before its first event or test.
          allOf:
            - $ref: "#/components/schemas/ChannelLastDelivery"
          nullable: true
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    ChannelInput:
      type: object
      description: Fields to create or update a channel.
      required: [name, type, config]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Unique name in the org.}
        type:
          description: 'Channel kind. Immutable after create (422 "type cannot change").'
          allOf:
            - $ref: "#/components/schemas/ChannelType"
        config: {type: object, additionalProperties: true, description: Notifier config fields, validated against GET /meta/schemas notifiers. A secret field (schema secret true) sent as __unchanged__ or left out keeps the stored value on update.}
        events: {type: array, items: {$ref: "#/components/schemas/EventKind"}, default: [], description: Kinds this channel receives; empty (the default) means every kind.}
        minSeverity:
          description: Only events at or above this severity. Default info.
          allOf:
            - $ref: "#/components/schemas/Severity"
          default: info
        allOrgs: {type: boolean, default: false, description: 'Also receive every other org''s matching events. Needs a global admin (403 "all-orgs channels need a global admin" otherwise). Default false.'}
        enabled: {type: boolean, default: true, description: Delivers events. Default true.}
    DeliveryResult:
      type: object
      description: Outcome of one inline delivery, from testChannel or testSmtpSettings.
      required: [status, durationMs]
      properties:
        status:
          description: delivered or failed; an inline test never returns pending.
          allOf:
            - $ref: "#/components/schemas/DeliveryStatus"
        error: {type: string, maxLength: 1000, description: Why it failed; absent on success. Redacted of every secret value.}
        durationMs: {type: integer, description: Wall time the attempt took, in milliseconds.}
    EventKind:
      type: string
      enum: [cert.issued, cert.renewal_failed, cert.expiring, cert.expired, deploy.failed, deploy.drift, client.offline, agent.cert_expiring, monitor.mismatch, monitor.unreachable, monitor.expiring, monitor.recovered, backup.completed, backup.failed, test]
      description: What happened. Severity and resource type follow deterministically from kind (docs/notifications.md#events).
    Severity:
      type: string
      enum: [info, warning, critical]
      description: How serious an event is.
    EventResourceType:
      type: string
      enum: [certificate, grant, client, monitor, backup, channel]
      description: Kind of object an event is about.
    EventResource:
      type: object
      description: The object an event is about.
      required: [type, id, name]
      properties:
        type: {$ref: "#/components/schemas/EventResourceType"}
        id: {type: string, description: Object id; empty for a resource that no longer exists.}
        name: {type: string, description: Object display name at the time of the event.}
    EventDelivery:
      type: object
      description: One channel's delivery outcome for an event.
      required: [channelId, channelName, status, attempts, lastError, deliveredAt]
      properties:
        channelId: {type: string, format: uuid, description: Channel this delivery targets.}
        channelName: {type: string, description: Channel name at delivery time.}
        status: {$ref: "#/components/schemas/DeliveryStatus"}
        attempts: {type: integer, description: Delivery attempts made so far.}
        lastError: {type: string, nullable: true, maxLength: 1000, description: Most recent failure reason; null after success or before any attempt. Redacted of every secret value.}
        deliveredAt: {type: string, format: date-time, nullable: true, description: When delivery succeeded; null while pending or failed.}
    Event:
      type: object
      description: One notification event (Shared contracts, Other operations and Dedupe keys rows). Duplicate conditions are suppressed once at emission time (docs/notifications.md#dedupe); every event on this feed already passed that check.
      required: [id, kind, at, orgId, severity, resource, summary, details, deliveries]
      properties:
        id: {type: string, format: uuid, description: Event id.}
        kind: {$ref: "#/components/schemas/EventKind"}
        at: {type: string, format: date-time, description: When it happened.}
        orgId: {type: string, format: uuid, nullable: true, description: Owning org; null for a global event, for example backup.*.}
        severity: {$ref: "#/components/schemas/Severity"}
        resource: {$ref: "#/components/schemas/EventResource"}
        summary: {type: string, maxLength: 500, description: Human-readable one-line summary.}
        details:
          type: object
          additionalProperties: true
          description: Event-specific fields, for example a certificate's notAfter or a monitor's fingerprint. Never carries key material, KEK ids or Vault addresses.
        deliveries: {type: array, items: {$ref: "#/components/schemas/EventDelivery"}, description: Delivery outcome per matched channel.}
    EventPage:
      type: object
      description: One page of events (Shared contracts, Other operations row).
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Event"}, description: Events, newest first.}
        nextCursor: {type: string, nullable: true, description: Cursor for the next (older) page; null on the last page.}
    MonitorState:
      type: string
      enum: [unknown, ok, mismatch, expiring, unreachable]
      description: A monitor's most recently observed state; unknown before its first check.
    Monitor:
      type: object
      description: A TLS endpoint CertForge polls on a schedule (Shared contracts, Monitor operations row).
      required: [id, orgId, name, host, port, sni, intervalSeconds, expectedCertificateId, expectedCertificateName, enabled, state, lastCheckedAt, nextCheckAt, lastFingerprint, lastNotAfter, lastIssuer, lastError, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: Monitor id.}
        orgId: {type: string, format: uuid, description: Owning org.}
        name: {type: string, minLength: 1, maxLength: 100, description: Unique name in the org.}
        host: {type: string, maxLength: 253, description: Hostname or IP address to connect to.}
        port: {type: integer, minimum: 1, maximum: 65535, description: TCP port to connect to.}
        sni: {type: string, nullable: true, maxLength: 253, description: TLS server name to send; null uses host.}
        intervalSeconds: {type: integer, minimum: 300, maximum: 86400, description: Seconds between scheduled checks.}
        expectedCertificateId: {type: string, format: uuid, nullable: true, description: A CertForge certificate the observed leaf is compared against; null skips the mismatch check.}
        expectedCertificateName: {type: string, nullable: true, description: That certificate's name, for display; null when expectedCertificateId is null.}
        enabled: {type: boolean, description: Checked on the scan schedule and countable toward the org's monitor limit.}
        state: {$ref: "#/components/schemas/MonitorState"}
        lastCheckedAt: {type: string, format: date-time, nullable: true, description: When the most recent check ran; null before the first check.}
        nextCheckAt: {type: string, format: date-time, nullable: true, description: When the next scheduled check is due.}
        lastFingerprint: {type: string, nullable: true, description: SHA-256 fingerprint (hex) of the observed leaf; null before the first successful check.}
        lastNotAfter: {type: string, format: date-time, nullable: true, description: Expiry of the observed leaf; null before the first successful check.}
        lastIssuer: {type: string, nullable: true, maxLength: 1000, description: Issuer of the observed leaf; null before the first successful check.}
        lastError: {type: string, nullable: true, maxLength: 1000, description: Most recent check failure; null after a successful check or before any check.}
        createdAt: {type: string, format: date-time, description: Creation time.}
        updatedAt: {type: string, format: date-time, description: Last change.}
    MonitorInput:
      type: object
      description: Fields to create or update a monitor.
      required: [name, host]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Unique name in the org.}
        host: {type: string, maxLength: 253, description: Hostname or IP address to connect to.}
        port: {type: integer, minimum: 1, maximum: 65535, default: 443, description: TCP port to connect to. Default 443.}
        sni: {type: string, nullable: true, maxLength: 253, description: TLS server name to send; omitted or null uses host.}
        intervalSeconds: {type: integer, minimum: 300, maximum: 86400, default: 3600, description: Seconds between scheduled checks. Default 3600.}
        expectedCertificateId: {type: string, format: uuid, nullable: true, description: A certificate in this org to compare the observed leaf against; a certificate in another org is 422. Omitted or null skips the mismatch check.}
        enabled: {type: boolean, default: true, description: Checked on the scan schedule. Default true.}
    BackupSchedule:
      type: string
      enum: [off, daily, weekly]
      description: The scheduled backup cadence (settings section backup, field schedule).
    BackupStatus:
      type: object
      description: Backup configuration and the most recent outcome (Shared contracts, Other operations row).
      required: [schedule, escrowConfirmed, directory, lastSuccessAt, lastFailureAt, lastError, lastSizeBytes, lastFile, nextAt]
      properties:
        schedule: {$ref: "#/components/schemas/BackupSchedule"}
        escrowConfirmed: {type: boolean, description: The backup section's kekEscrowConfirmed; createBackup and the scheduled job both require this before writing an archive.}
        directory: {type: string, nullable: true, description: Where scheduled backups are written; null while schedule is off.}
        lastSuccessAt: {type: string, format: date-time, nullable: true, description: When a backup (scheduled or on demand) last completed; null if none ever has.}
        lastFailureAt: {type: string, format: date-time, nullable: true, description: When a backup last failed; null if none ever has.}
        lastError: {type: string, nullable: true, maxLength: 1000, description: The last failure's reason; null after a success or before any attempt.}
        lastSizeBytes: {type: integer, format: int64, nullable: true, description: Size of the last successful archive, in bytes; null if none ever has.}
        lastFile: {type: string, nullable: true, description: File name of the last successful scheduled archive; null for an on-demand download or before any scheduled backup.}
        nextAt: {type: string, format: date-time, nullable: true, description: When the next scheduled backup is due; null while schedule is off.}
    SmtpTestRequest:
      type: object
      description: Recipient for testSmtpSettings.
      required: [to]
      properties:
        to: {type: string, format: email, description: Address to send the test email to.}
    ServerInfo:
      type: object
      description: The running server's identity.
      required: [version]
      properties:
        version: {type: string, description: Build version string, for example the git describe output baked in at build time.}
