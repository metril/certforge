services:
  certforge:
    build:
      args:
        # Compiles in the e2e-only "e2e-challtestsrv" DNS provider
        # (internal/challenge/challtestsrv_e2e.go), never built into a
        # production image. The compose server calls challtestsrv itself
        # (challtestsrv:8055) and Pebble (pebble:14000) over the compose
        # network; the e2e test drives all of that through the server's own
        # HTTP API (CF_E2E_BASE_URL), not by reaching those services
        # directly, so only Pebble's management port needs a host port below.
        GO_TAGS: e2e
    # Distinct from compose.yaml's ghcr.io/metril/certforge:dev tag: without
    # this, `make e2e`'s build would retag "dev" with the e2e-only provider
    # compiled in, and a later plain `docker compose up` (dev) would then run
    # that e2e image instead of rebuilding a production one.
    image: certforge:e2e
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: -config test/config/pebble-config.json -strict -dnsserver challtestsrv:8053
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      # Disable authorization reuse so plan 1B's issuance e2e always sees a
      # fresh pending challenge instead of a cached valid authorization.
      PEBBLE_AUTHZREUSE: "0"
    ports:
      # Published so the host-side `go test` process (make e2e runs it
      # outside the compose network) can independently verify the issued
      # chain against https://localhost:${CF_PEBBLE_MGMT_PORT:-15000}/intermediates/0.
      # The ACME port itself is not published: the e2e test never talks to
      # Pebble directly, only the compose server does (over the compose
      # network, at pebble:14000).
      - "${CF_PEBBLE_MGMT_PORT:-15000}:15000"
    depends_on:
      - challtestsrv
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    command: -defaultIPv6 "" -defaultIPv4 127.0.0.1
