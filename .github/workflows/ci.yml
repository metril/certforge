name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -race ./...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test -race -tags integration ./...
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # generate also runs `npm --prefix web run gen` (openapi-typescript +
      # tsr), so web/'s toolchain and node_modules need to exist first.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # git diff --exit-code only catches modified tracked files; a query or
      # spec change that adds a new generated file would pass silently, so
      # this checks the working tree is clean of both modifications and
      # untracked files. git status/diff run first, unconditionally, so any
      # drift is visible in the log even though the actual gate is the
      # test -z check on the next line.
      - run: |
          make generate
          git status --porcelain
          git diff
          test -z "$(git status --porcelain)"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
  embedweb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # internal/webui's embedweb build tag embeds internal/webui/dist, which
      # is only populated by `make build-embed` from a built web/ UI (Phase
      # 1C). A stub index.html is enough for go:embed and go vet to compile
      # the embedweb-tagged file in CI.
      - run: mkdir -p internal/webui/dist && printf '<!doctype html><title>stub</title>' > internal/webui/dist/index.html
      - run: go vet -tags embedweb ./...
  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.agent -t certforge-agent:ci .
      - run: docker run --rm certforge-agent:ci version
      - run: docker run --rm certforge-agent:ci status | grep -q "Not enrolled"
