name: ci
on:
  pull_request:
    # A release-please PR only touches these; the code was tested by the PR
    # that introduced it.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: go test -race ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: go test -race -tags integration ./...
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      # generate also runs `npm --prefix web run gen` (openapi-typescript +
      # tsr), so web/'s toolchain and node_modules need to exist first.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # git diff --exit-code only catches modified tracked files; a query or
      # spec change that adds a new generated file would pass silently, so
      # this checks the working tree is clean of both modifications and
      # untracked files. git status/diff run first, unconditionally, so any
      # drift is visible in the log even though the actual gate is the
      # test -z check on the next line.
      - run: |
          make generate
          git status --porcelain
          git diff
          test -z "$(git status --porcelain)"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
  embedweb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      # internal/webui's embedweb build tag embeds internal/webui/dist, which
      # is only populated by `make build-embed` from a built web/ UI (Phase
      # 1C). A stub index.html is enough for go:embed and go vet to compile
      # the embedweb-tagged file in CI.
      - run: mkdir -p internal/webui/dist && printf '<!doctype html><title>stub</title>' > internal/webui/dist/index.html
      - run: go vet -tags embedweb ./...
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f deploy/Dockerfile.agent -t certforge-agent:ci .
      - run: docker run --rm certforge-agent:ci version
      - run: docker run --rm certforge-agent:ci status | grep -q "Not enrolled"
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      # Pinned; go downloads the Go 1.26 toolchain this release requires.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Same Dockerfile and build args as the release's certforge image, but
      # amd64 only and not pushed, so a break shows up here and not at release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          build-args: |
            VERSION=ci
            WITH_WEB=1
          cache-from: type=gha,scope=certforge-ci
          cache-to: type=gha,mode=max,scope=certforge-ci
