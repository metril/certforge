openapi: 3.0.3
info:
  title: CertForge API
  version: 0.1.0
  description: |
    CertForge REST API. All paths are relative to /api/v1.

    Authentication: the `cf_session` cookie set by POST /auth/login or POST /setup/complete.
    POST, PUT, PATCH, and DELETE with a session must send the `X-CSRF-Token` header with
    `csrfToken` from GET /auth/me. Request bodies must be `application/json`.

    Errors are RFC 9457 application/problem+json documents (see the Problem schema and
    components.responses): 400, 401, 403 (missing permission or CSRF failure), 404, 409,
    413, 415, 422, 429 (login rate limit, with Retry-After), 500, 502 (upstream CA or
    identity provider), 503 (busy, with Retry-After).

    Agents do not use this API: certforge-agent talks to /agent/v1/* on the separate
    mTLS agent listener (CF_LISTEN_AGENT), described in docs/architecture.md.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerApiKey: []
tags:
  - name: meta
    description: Registries of pluggable types.
  - name: orgs
    description: Organizations.
  - name: auth
    description: Login, logout, and the current principal.
  - name: settings
    description: Schema-driven settings sections.
  - name: setup
    description: First-run setup wizard.
  - name: issuers
    description: CAs, ACME accounts and DNS credentials.
  - name: certificates
    description: Certificates and issuance defaults.
  - name: access
    description: Users, role bindings, and API keys.
  - name: audit
    description: The audit log.
  - name: clients
    description: Enrolled agents, their grants, deployments and hook runs.
  - name: delivery
    description: Output layouts, deploy targets and hooks that grants use.
  - name: agents
    description: The internal agent CA and the agent listener.
  - name: notifications
    description: Notification channels and the event feed (Phase 6A).
  - name: monitoring
    description: External TLS endpoint monitors (Phase 6A).
  - name: backup
    description: Encrypted database backup (Phase 6A).
  - name: server
    description: Server-wide status.
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: First-run status
      description: Whether the first-run setup wizard still needs to run. Public.
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500": {$ref: "#/components/responses/InternalError"}
  /setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Complete first-run setup
      description: Sets the local admin password, stores the base URL, creates the first org, and logs the admin in. Works once; later calls get 409. Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup done; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /meta/schemas:
    get:
      operationId: getMetaSchemas
      tags: [meta]
      summary: List pluggable type schemas
      description: JSON Schemas for every registered DNS provider, deploy target, notifier, and signer. The UI renders forms from them.
      responses:
        "200":
          description: Schemas grouped by kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaSchemas"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /server-info:
    get:
      operationId: getServerInfo
      tags: [server]
      summary: Server version
      description: The running server's version, for cfctl status and support requests. Any authenticated principal.
      responses:
        "200":
          description: Server info.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs:
    get:
      operationId: listOrgs
      tags: [orgs]
      summary: List organizations
      description: Organizations visible to the caller.
      responses:
        "200":
          description: Visible organizations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization
      description: Needs orgs:write (global admin). The slug is permanent; "all" is reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrgInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Org"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    patch:
      operationId: updateOrg
      tags: [orgs]
      summary: Rename an organization
      description: Needs orgs:write. The slug is permanent; sending a different one is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrgUpdate"}
      responses:
        "200":
          description: Updated org.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Org"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteOrg
      tags: [orgs]
      summary: Delete an organization
      description: Needs orgs:write. Blocked (409) while the org has certificates, DNS credentials, ACME accounts, CAs, sites, role bindings, or active API keys; the detail lists them. Its issuance defaults and revoked API keys are removed with the org.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/sites:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listSites
      tags: [orgs]
      summary: List sites
      description: Needs sites:read in the org.
      responses:
        "200":
          description: Sites sorted by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createSite
      tags: [orgs]
      summary: Create a site
      description: Needs sites:write in the org. Names are unique per org.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SiteInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/sites/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    patch:
      operationId: updateSite
      tags: [orgs]
      summary: Rename a site
      description: Needs sites:write in the org.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SiteInput"}
      responses:
        "200":
          description: Updated site.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteSite
      tags: [orgs]
      summary: Delete a site
      description: Needs sites:write in the org. Site-scoped role bindings go with it.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as the local admin
      description: Break-glass local admin login. Sets the cf_session cookie and revokes the user's other sessions. Rate limited per client address (429 with Retry-After).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400": {$ref: "#/components/responses/BadRequest"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Ends the current session and clears the cookie. Requires X-CSRF-Token.
      responses:
        "204":
          description: Logged out.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current principal
      description: The signed-in user, roles, visible orgs, and the CSRF token for mutating requests. Session-only, since it returns the session's CSRF token, which an API key never has; an authenticated API-key principal gets 403, not 401.
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: Available sign-in methods
      description: Which sign-in methods the login page offers. Public.
      security: []
      responses:
        "200":
          description: Sign-in methods.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthMethods"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/oidc/start:
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Start single sign-on
      description: Redirects the browser to the identity provider (auth code with PKCE) and sets a short-lived signed state cookie. Redirects to /login?error=oidc_disabled when single sign-on is off. Public.
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Same-origin path to open after sign-in; anything else becomes /.
          schema: {type: string}
      responses:
        "302":
          description: Redirect to the identity provider or back to /login.
          headers:
            Location:
              description: Redirect target.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Single sign-on callback
      description: The identity provider returns here. On success creates or updates the user by (issuer, subject), records groups, starts a session (revoking the user's others), and redirects to next. On failure redirects to /login?error= one of oidc_state, oidc_denied, oidc_failed, oidc_disabled, user_disabled, rate_limited. Public; rate limited per client address (redirects rather than returning 429).
      security: []
      parameters:
        - {name: code, in: query, required: false, description: Authorization code., schema: {type: string}}
        - {name: state, in: query, required: false, description: State echoed by the provider., schema: {type: string}}
        - {name: error, in: query, required: false, description: Error code from the provider., schema: {type: string}}
        - {name: error_description, in: query, required: false, description: Provider error text; logged only., schema: {type: string}}
      responses:
        "302":
          description: Redirect to next or to /login?error=.
          headers:
            Location:
              description: Redirect target.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/authentication/test:
    post:
      operationId: testAuthentication
      tags: [settings]
      summary: Test an OIDC issuer
      description: Fetches the issuer's discovery document and JWKS without logging in. Needs settings:write. Always 200; ok false carries the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthenticationTestRequest"}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthenticationTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/vault/test:
    post:
      operationId: testVaultSettings
      tags: [settings]
      summary: Test Vault connectivity
      description: >-
        Needs settings:write. Logs in to Vault (or OpenBao) with the given settings and reports
        the outcome, using the same authMethod pairing and address/namespace rules as PUT
        /settings/vault. A secret field (token, secretId) omitted or __unchanged__ uses the
        currently stored value, unless address or namespace changed, which is 422 ("re-enter the
        token"). Always 200 once the request is well-formed; ok false carries the error. Not
        recorded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VaultSettings"}
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/smtp/test:
    post:
      operationId: testSmtpSettings
      tags: [settings]
      summary: Send a test email
      description: >-
        Needs settings:write. Sends a test email through the saved "smtp" section (host, port,
        username, security and timeout come from storage; only the recipient is taken from the
        request body). 422 "SMTP is not configured" when the saved section's host is empty.
        Always 200 once the request is well-formed; ok false carries the redacted error. Recorded
        as smtp.test (ok).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmtpTestRequest"}
      responses:
        "200":
          description: Delivery result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeliveryResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /settings/{section}:
    parameters:
      - name: section
        in: path
        required: true
        description: Section name, for example general, backup, or issuance_defaults.
        schema:
          type: string
    get:
      operationId: getSettingsSection
      tags: [settings]
      summary: Read a settings section
      description: Returns the section's JSON Schema and its current value (the default when unset).
      responses:
        "200":
          description: Section schema and value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSection"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: putSettingsSection
      tags: [settings]
      summary: Replace a settings section
      description: >-
        Validates the value against the section schema (422 on failure) and stores it. Admin only.
        For a secret property (schema "secret": true), send "__unchanged__" or omit the field to keep
        the stored value, "" to clear it, or any other string to replace it; "__unchanged__" with
        nothing stored is a 422. Secret values are never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsValue"
      responses:
        "200":
          description: Stored section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSection"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /keys/status:
    get:
      operationId: getKeysStatus
      tags: [settings]
      summary: Read key-encryption key status
      description: >-
        Needs global settings:read. The active KEK, any previous KEKs still configured to decrypt
        old data, whether a round-trip canary against the active KEK just succeeded, and the most
        recent rewrap (running or finished; null if one has never run).
      responses:
        "200":
          description: Current key status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeysStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /keys/rewrap:
    post:
      operationId: startRewrap
      tags: [settings]
      summary: Start rewrapping secrets under the active KEK
      description: >-
        Needs global settings:write. Starts, in the background, re-encrypting every secret under
        the active KEK, table by table in order (settings; cas, covering eab_hmac and secret_cfg
        together; acme_accounts; dns_provider_credentials; output_specs; agent_cas;
        certificate_versions); 409 while a rewrap is already running. Recorded as
        kek.rewrap_started (activeKekId) when it starts and kek.rewrap_finished (rewrapped,
        remaining; system actor) when it completes.
      responses:
        "202":
          description: Rewrap started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeysStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /meta/ca-presets:
    get:
      operationId: listCaPresets
      tags: [issuers]
      summary: List CA presets
      description: Well-known ACME CAs with their directory URLs and whether they require External Account Binding. Needs cas:read.
      responses:
        "200":
          description: Presets in display order.
          content:
            application/json:
              schema:
                type: array
                description: Presets.
                items: {$ref: "#/components/schemas/CAPreset"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/cas:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listCas
      tags: [issuers]
      summary: List ACME CAs
      description: CAs of the org sorted by name. Needs cas:read.
      responses:
        "200":
          description: All CAs of the org.
          content:
            application/json:
              schema:
                type: array
                description: CAs.
                items: {$ref: "#/components/schemas/CA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createCa
      tags: [issuers]
      summary: Add an ACME CA
      description: Needs cas:write (global admin). A preset fills directoryUrl when omitted. Presets that require EAB return 422 without eabKid and eabHmac.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CAInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/cas/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getCa
      tags: [issuers]
      summary: Get a CA
      description: Needs cas:read.
      responses:
        "200":
          description: The CA.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateCa
      tags: [issuers]
      summary: Replace a CA
      description: Needs cas:write. eabHmac omitted, null or __unchanged__ keeps the stored HMAC; an empty string removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CAInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteCa
      tags: [issuers]
      summary: Delete a CA
      description: Needs cas:write. 409 while accounts, certificates or defaults reference it.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/cas/{id}/rotate:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: rotateCa
      tags: [issuers]
      summary: Rotate a private CA's issuing key
      description: >-
        Needs cas:write. localca only, and only with a held root key: generates a new issuing
        certificate under the same root and retires (never deletes) the current issuing key,
        sealed until its certificate's notAfter — a CRL must be signed by its own issuer, so
        leaves already issued under the retired key can still be revoked. 422 for any other CA
        kind, or a localca CA without a held root key. Recorded as ca.rotate in the audit log with
        newIssuerSerial and retiredSerial.
      responses:
        "200":
          description: The CA with its new issuing certificate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CA"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/acme-accounts:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listAcmeAccounts
      tags: [issuers]
      summary: List ACME accounts
      description: Accounts of the org sorted by email. Needs accounts:read.
      responses:
        "200":
          description: All accounts of the org.
          content:
            application/json:
              schema:
                type: array
                description: Accounts.
                items: {$ref: "#/components/schemas/AcmeAccount"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createAcmeAccount
      tags: [issuers]
      summary: Register an ACME account
      description: Needs accounts:write. Registers at the CA now (with the CA's EAB) and stores the account key encrypted. A CA rejection returns 502 with the ACME problem in detail.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcmeAccountInput"}
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcmeAccount"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /orgs/{orgId}/acme-accounts/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getAcmeAccount
      tags: [issuers]
      summary: Get an ACME account
      description: Needs accounts:read.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcmeAccount"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteAcmeAccount
      tags: [issuers]
      summary: Delete an ACME account
      description: Needs accounts:write. Removes the stored account only; it is not deactivated at the CA. 409 while referenced.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listDNSCredentials
      tags: [issuers]
      summary: List DNS credentials
      description: Credentials of the org sorted by name, without secrets. Needs dnscreds:read.
      responses:
        "200":
          description: All credentials of the org.
          content:
            application/json:
              schema:
                type: array
                description: Credentials.
                items: {$ref: "#/components/schemas/DNSCredential"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createDNSCredential
      tags: [issuers]
      summary: Add a DNS credential
      description: Needs dnscreds:write. config keys must be properties of the provider schema from GET /meta/schemas; fields with secret true are stored encrypted. Unknown keys, a key with a serverPath schema property, or a provider marked unsupported all return 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getDNSCredential
      tags: [issuers]
      summary: Get a DNS credential
      description: Secrets are never returned. Needs dnscreds:read.
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateDNSCredential
      tags: [issuers]
      summary: Replace a DNS credential
      description: Needs dnscreds:write. config is replaced as a whole; a secret field set to __unchanged__ keeps its stored value and a secret field left out is removed. The provider cannot change; 422 if it is (or has since become) marked unsupported.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialUpdate"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteDNSCredential
      tags: [issuers]
      summary: Delete a DNS credential
      description: Needs dnscreds:write. 409 while certificates, org defaults or the global defaults reference it.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/dns-credentials/{id}/test:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: testDNSCredential
      tags: [issuers]
      summary: Test a DNS credential
      description: Needs dnscreds:write. Creates and removes a TXT record at _acme-challenge._certforge-test.<zone> (lego always adds the _acme-challenge label). Provider failures return 200 with ok false; error text has every config value redacted. Past a bounded timeout the response is ok false with error "timed out", but cleanup keeps running in the background. At most 2 tests run at once server-wide; beyond that this returns 503 with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialTestRequest"}
      responses:
        "200":
          description: Test outcome.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredentialTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /orgs/{orgId}/dns-credentials/{id}/reveal:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: revealDNSCredentialSecret
      tags: [issuers]
      summary: Reveal a stored DNS credential secret
      description: Needs dnscreds:reveal (global admin only). Returns one stored secret field in plaintext and records a dns_credential.secret_revealed audit event (never containing the value); if the audit write fails the value is not returned. 422 if field is not a secret field of the provider; 404 if it is but has no stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSCredentialRevealRequest"}
      responses:
        "200":
          description: The secret value.
          headers:
            Cache-Control: {description: no-store, schema: {type: string}}
            Pragma: {description: no-cache, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSCredentialRevealResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/issuance-defaults:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getOrgIssuanceDefaults
      tags: [certificates]
      summary: Get org issuance defaults
      description: The org level only; null fields inherit from the global settings section issuance_defaults. Needs certs:read.
      responses:
        "200":
          description: Org defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuanceDefaults"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: putOrgIssuanceDefaults
      tags: [certificates]
      summary: Replace org issuance defaults
      description: Null or omitted fields inherit from global. Applies at each inheriting certificate's next renewal. Needs certs:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssuanceDefaults"}
      responses:
        "200":
          description: Stored defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuanceDefaults"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/issuance-defaults/effective:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getEffectiveIssuanceDefaults
      tags: [certificates]
      summary: Get effective org defaults
      description: Each field's resolved value and the level it came from (default, global, org). Needs certs:read.
      responses:
        "200":
          description: Effective defaults.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EffectiveIssuanceDefaults"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /certificates:
    get:
      operationId: listAllCertificates
      tags: [certificates]
      summary: List certificates across orgs
      description: Like listCertificates, over every org where the caller has certs:read (the UI's read-only All orgs view). 403 when there is none. Items carry orgId.
      parameters:
        - {$ref: "#/components/parameters/ListStatus"}
        - {$ref: "#/components/parameters/ListQ"}
        - {$ref: "#/components/parameters/ListSort"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of certificates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates
      description: Needs certs:read. status filters by status; q matches the name and any certificate name; sort is name, notAfter, nextRenewAt or status, with a leading - for descending.
      parameters:
        - {$ref: "#/components/parameters/ListStatus"}
        - {$ref: "#/components/parameters/ListQ"}
        - {$ref: "#/components/parameters/ListSort"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of certificates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Create a certificate
      description: Needs certs:write. Names are validated and de-duplicated; the first issuance is queued immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/upload:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    post:
      operationId: uploadCertificate
      tags: [certificates]
      summary: Store an existing certificate as unmanaged
      description: >-
        Needs certs:write. Creates an unmanaged certificate (managed false): CertForge never
        renews it. Recorded as certificate.upload in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateUpload"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/import:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    post:
      operationId: importCertificates
      tags: [certificates]
      summary: Import certificates from an acme.sh or certbot archive
      description: >-
        Needs certs:write. dryRun (default true) previews without storing anything. Creates
        managed certificates, renewed against caId with nextRenewAt set; recorded as one
        certificate.import per run (details: created, skipped, names).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Import archive and options.
              required: [archive, caId]
              properties:
                archive: {type: string, format: binary, description: "tar or zip archive of an acme.sh or certbot state directory. Limits: 32 MiB compressed, 128 MiB uncompressed, 2,000 entries."}
                caId: {type: string, format: uuid, description: "CA to record each imported version against, for the rate ledger and future renewal."}
                dryRun: {type: boolean, default: true, description: Preview only; nothing is stored when true.}
      responses:
        "200":
          description: Result, or preview when dryRun is true.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getCertificate
      tags: [certificates]
      summary: Get a certificate
      description: Needs certs:read.
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Replace a certificate definition
      description: Needs certs:write. Changing names queues a new issuance; other changes apply at the next renewal. 409 "managed externally" for an unmanaged certificate (managed false).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateInput"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Certificate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      description: Deletes the definition with all versions and attempts; does not revoke. Needs certs:write. 409, naming up to five layouts, when a layout lists it as an extra certificate.
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/renew:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: renewCertificate
      tags: [certificates]
      summary: Issue now
      description: Queues an issuance. enqueued is false when one is already queued or running. Needs certs:issue. 409 "managed externally" for an unmanaged certificate (managed false).
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RenewResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/BadGateway"}
  /orgs/{orgId}/certificates/{id}/versions:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listCertificateVersions
      tags: [certificates]
      summary: List versions
      description: Issued versions, newest first. Needs certs:read.
      responses:
        "200":
          description: All versions.
          content:
            application/json:
              schema:
                type: array
                description: Versions.
                items: {$ref: "#/components/schemas/CertificateVersion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/versions/upload:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: uploadCertificateVersion
      tags: [certificates]
      summary: Add an uploaded version to an unmanaged certificate
      description: >-
        Needs certs:write. 409 when the certificate is managed. Recorded as
        certificate.version_uploaded in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CertificateVersionUpload"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/attempts:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listIssuanceAttempts
      tags: [certificates]
      summary: List issuance attempts
      description: The 50 newest attempts with step timeline and log. Needs certs:read.
      responses:
        "200":
          description: Attempts, newest first.
          content:
            application/json:
              schema:
                type: array
                description: Attempts.
                items: {$ref: "#/components/schemas/IssuanceAttempt"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/versions/{vid}/download:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/VersionId"}
    get:
      operationId: downloadCertificateVersion
      tags: [certificates]
      summary: Download a version
      description: >-
        Needs certs:read; the key and combined parts also need keys:export and are recorded in the
        audit log before anything is sent. One file returns its raw bytes, several a zip. der
        supports only cert, chain and key parts, one per file; fullchain and combined are 422
        ("not available as DER").
      parameters:
        - name: format
          in: query
          required: false
          description: Output format.
          schema: {type: string, enum: [pem, der], default: pem}
        - name: parts
          in: query
          required: true
          description: Comma-separated parts from cert, chain, fullchain, key, combined (fullchain plus key).
          schema: {type: string, example: "fullchain,key"}
      responses:
        "200":
          description: File contents.
          headers:
            Content-Disposition:
              description: Attachment file name.
              schema: {type: string}
          content:
            application/x-pem-file:
              schema: {type: string, format: binary, description: PEM file.}
            application/octet-stream:
              schema: {type: string, format: binary, description: DER file.}
            application/zip:
              schema: {type: string, format: binary, description: Zip of files.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/versions/{vid}/export:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/VersionId"}
    post:
      operationId: exportCertificateVersion
      tags: [certificates]
      summary: Export a version as PKCS#12 or JKS
      description: >-
        Needs certs:read and keys:export; recorded as certificate.key_exported in the audit log
        before anything is sent. A version with no stored key 404s before anything is audited.
        The password is never logged, audited, put in a URL, or returned by any read.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportRequest"}
      responses:
        "200":
          description: The container file.
          headers:
            Content-Disposition:
              description: 'Attachment file name: "<SafeName>.p12" or "<SafeName>.jks".'
              schema: {type: string}
          content:
            application/x-pkcs12:
              schema: {type: string, format: binary, description: PKCS#12 file.}
            application/x-java-keystore:
              schema: {type: string, format: binary, description: JKS file.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/versions/{vid}/revoke:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/Id"}
      - {$ref: "#/components/parameters/VersionId"}
    post:
      operationId: revokeCertificateVersion
      tags: [certificates]
      summary: Revoke an issued version
      description: >-
        Needs certs:issue. Marks the version revoked with the given reason so it is listed on its
        issuer's CRL from the next rebuild. Private CAs only: 422 "not supported for ACME CAs
        yet" for a version issued by an acme CA, and 422 for a version that was imported or
        uploaded rather than issued. 409 if the version is already revoked. Recorded as
        certificate.revoked in the audit log with certificateId, versionId, serial and reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeRequest"}
      responses:
        "200":
          description: The revoked version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/manual-dns:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listManualDNS
      tags: [certificates]
      summary: List pending manual TXT records
      description: Records an operator must add; empty unless a manual-dns attempt is waiting. Needs certs:read.
      responses:
        "200":
          description: Pending records.
          content:
            application/json:
              schema:
                type: array
                description: Records.
                items: {$ref: "#/components/schemas/ManualDNSRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/manual-dns/confirm:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: confirmManualDNS
      tags: [certificates]
      summary: Confirm manual TXT records
      description: Resumes the waiting attempt. 409 when nothing is waiting or the records expired. Needs certs:issue.
      responses:
        "202":
          description: Confirmed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManualDNSConfirmResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/certificates/{id}/deployments:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listCertificateDeployments
      tags: [clients]
      summary: List a certificate's deployments
      description: Needs clients:read in the org. One row per live grant of this certificate, with the client and its deployment state.
      responses:
        "200":
          description: Deployments sorted by client name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CertificateDeploymentList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/rate-ledger:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: getRateLedger
      tags: [certificates]
      summary: Read the CA's current rate-limit usage
      description: Needs certs:read. certificate narrows duplicateCertsPerWeek to that certificate's own names; without it, that item is omitted.
      parameters:
        - name: ca
          in: query
          required: true
          description: CA to read usage for.
          schema: {type: string, format: uuid}
        - name: certificate
          in: query
          required: false
          description: Certificate to narrow duplicateCertsPerWeek to, in this CA's org.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Current usage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateLedger"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /clients:
    get:
      operationId: listAllClients
      tags: [clients]
      summary: List clients across orgs
      description: Like listClients, over every org where the caller has clients:read (the UI's read-only All orgs view). 403 when there is none. Items carry orgId.
      parameters:
        - {$ref: "#/components/parameters/ClientSite"}
        - {$ref: "#/components/parameters/ClientStatusFilter"}
        - {$ref: "#/components/parameters/ClientQ"}
        - {$ref: "#/components/parameters/ClientSort"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      description: Needs clients:read. site, status and q filter; sort is name, lastSeen or status with a leading - for descending. A cursor only continues the request it came from (422 otherwise).
      parameters:
        - {$ref: "#/components/parameters/ClientSite"}
        - {$ref: "#/components/parameters/ClientStatusFilter"}
        - {$ref: "#/components/parameters/ClientQ"}
        - {$ref: "#/components/parameters/ClientSort"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      description: Needs clients:write. Creates a pending client and returns its one-time enrolment token, shown once; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "201":
          description: Created; token shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      description: Needs clients:read.
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Rename a client or change its site
      description: Needs clients:write. Both fields are sent; siteId null clears the site.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientUpdate"}
      responses:
        "200":
          description: Updated client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      description: Needs clients:write. Only pending or revoked clients can be deleted (409 otherwise); their grants, deployments and hook runs go with them. 409, naming up to five certificates, when a verification rule's clientId still points at it.
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients/{id}/revoke:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: revokeClient
      tags: [clients]
      summary: Revoke a client
      description: Needs clients:write. Refuses the agent's certificate from now on, deletes unused tokens and closes its socket (code 4001). Also hard-deletes any of this client's grants still awaiting agent removal confirmation (audited per grant with forced true), since a revoked agent can never confirm one. Revoking twice is a no-op.
      responses:
        "200":
          description: The revoked client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients/{id}/reenroll:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: reenrollClient
      tags: [clients]
      summary: Issue a new enrolment token
      description: Needs clients:write. Returns the client to pending with a fresh one-time token, refuses its current agent certificate and closes its socket. 409 for a revoked client.
      responses:
        "200":
          description: The pending client and its new token, shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientCreated"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients/{id}/grants:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listClientGrants
      tags: [clients]
      summary: List a client's grants
      description: Needs clients:read. Live grants with their deployment, sorted by certificate name.
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GrantList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createGrant
      tags: [clients]
      summary: Grant a certificate to a client
      description: >-
        Needs clients:write. The certificate, layout, deploy target and hooks must be in the
        client's org (422 otherwise); a layout or a deploy target is required. One grant per
        client and certificate (409). Two grants on one client never write the same path, counting
        Traefik `certs/<name>` files and grants awaiting agent removal (409). 422 when the
        certificate's current version has no key and the layout or target needs one. Bumps the
        client's desired revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GrantInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Grant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/clients/{id}/hook-runs:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    get:
      operationId: listClientHookRuns
      tags: [clients]
      summary: List a client's hook runs
      description: Needs clients:read. Newest first; stdout and stderr are capped at 8 KiB each.
      parameters:
        - {$ref: "#/components/parameters/ListLimit"}
        - {$ref: "#/components/parameters/ListCursor"}
      responses:
        "200":
          description: One page of hook runs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HookRunList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/grants/{id}:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    patch:
      operationId: updateGrant
      tags: [clients]
      summary: Change a grant
      description: >-
        Needs clients:write. Replaces delivery, layout, deploy target, hooks and
        auto-remediation; the certificate cannot change. Re-renders the deployment and bumps
        the client's revision. 409 when another of the client's grants (including one awaiting
        agent removal) would write one of the same file paths. 422 when the certificate's
        current version has no key and the layout or target needs one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GrantUpdate"}
      responses:
        "200":
          description: Updated grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Grant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deleteGrant
      tags: [clients]
      summary: Delete a grant
      description: Needs clients:write. The agent removes the files (Traefik YAML first) on its next sync and the grant disappears once it reports; for a client that never enrolled or is revoked it is deleted at once. force skips waiting for the agent and hard-deletes a removal-pending or still-live grant immediately, audited with forced true — for an agent that is gone for good.
      parameters:
        - {$ref: "#/components/parameters/GrantForce"}
      responses:
        "204": {description: Deleted or queued for removal.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/grants/{id}/redeploy:
    parameters: [{$ref: "#/components/parameters/OrgId"}, {$ref: "#/components/parameters/Id"}]
    post:
      operationId: redeployGrant
      tags: [clients]
      summary: Redeploy a grant
      description: Needs clients:write. A force reinstall, whether or not anything changed since the last deploy — bumps the grant's redeploySeq, marks the deployment pending and bumps the client's revision so the agent rewrites every file, re-runs its hooks, and reports again.
      responses:
        "200":
          description: The grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Grant"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /orgs/{orgId}/layouts:
    parameters: [{$ref: "#/components/parameters/OrgId"}]
    get:
      operationId: listLayouts
      tags: [delivery]
      summary: List output layouts
      description: Needs delivery:read.
      responses:
        "200":
          description: Layouts sorted by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LayoutList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: createLayout
      tags: [delivery]
      summary: Create an output layout
      description: Needs delivery:write. Paths are absolute and clean on the agent host; names are unique per org.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LayoutInput"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Layout"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
