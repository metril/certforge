Name = "Fake DNS"
Code = "fakedns"
URL = "https://fake.example"
Aliases = ["fake"]

[Configuration]
  [Configuration.Credentials]
    FAKE_API_TOKEN = "API token"
    FAKE_USERNAME = "Account user"
    FAKE_PASSWORD = "Account password"
  [Configuration.Additional]
    FAKE_TTL = "TTL (Default: 120)"
    FAKE_KEY_FILE_PATH_HINT = "Secret: matches the key regex and isn't on the non-secret suffix or override lists"
    FAKE_CREDENTIALS_FILE = "Path to a local credentials file"
