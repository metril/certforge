# Runs a released CertForge image from GHCR instead of building locally.
#
#   CF_VERSION=0.1.0 docker compose -f deploy/compose.release.yaml up -d
#
# Pin CF_VERSION in production; it defaults to `latest`. Everything else
# matches compose.yaml (same env vars, ports, and ./secrets/kek).
name: certforge
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certforge
      POSTGRES_USER: certforge
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD:-certforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certforge -d certforge"]
      interval: 5s
      timeout: 5s
      retries: 20
  certforge:
    image: ghcr.io/metril/certforge:${CF_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    # Longer than Docker's 10s default: graceful shutdown can take up to 15s
    # draining HTTP plus up to 40s draining river; see "Shutdown" in
    # docs/operations.md.
    stop_grace_period: 60s
    environment:
      CF_DATABASE_URL: postgres://certforge:${CF_DB_PASSWORD:-certforge}@postgres:5432/certforge?sslmode=disable
      CF_KEK_FILE: /run/secrets/cf_kek
      CF_BASE_URL: ${CF_BASE_URL:-http://localhost:${CF_HTTP_PORT:-8080}}
      CF_LOG_LEVEL: ${CF_LOG_LEVEL:-info}
    secrets:
      - cf_kek
    ports:
      - "${CF_HTTP_PORT:-8080}:8080"
      - "${CF_AGENT_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/certforge", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
secrets:
  cf_kek:
    file: ./secrets/kek
volumes:
  pgdata:
