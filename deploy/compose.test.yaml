services:
  postgres:
    ports:
      # Published for plan 1B's issuance e2e test, which opens its own
      # database directly on this Postgres instance (the test runs as a
      # host-side `go test` process, outside the compose network) so the
      # running server's own scheduler never sees its certificates.
      - "${CF_E2E_PG_PORT:-55432}:5432"
  certforge:
    build:
      args:
        # Compiles in the e2e-only "e2e-challtestsrv" DNS provider
        # (internal/challenge/challtestsrv_e2e.go), never built into a
        # production image.
        GO_TAGS: e2e
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: -config test/config/pebble-config.json -strict -dnsserver challtestsrv:8053
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      # Disable authorization reuse so plan 1B's issuance e2e always sees a
      # fresh pending challenge instead of a cached valid authorization.
      PEBBLE_AUTHZREUSE: "0"
    ports:
      # Published so host-side `go test` (make e2e runs it outside the
      # compose network) can reach Pebble directly; plan 1B verifies chains
      # against https://localhost:${CF_PEBBLE_MGMT_PORT:-15000}/intermediates/0.
      - "${CF_PEBBLE_PORT:-14000}:14000"
      - "${CF_PEBBLE_MGMT_PORT:-15000}:15000"
    depends_on:
      - challtestsrv
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    command: -defaultIPv6 "" -defaultIPv4 127.0.0.1
    ports:
      - "${CF_CHALLTESTSRV_PORT:-8055}:8055"
      # UDP only: challenge.CheckTXT (the host-side e2e test's propagation
      # check) queries over UDP; nothing on the host side needs TCP.
      - "${CF_CHALLTESTSRV_DNS_PORT:-8053}:8053/udp"
