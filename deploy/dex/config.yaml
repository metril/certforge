# e2e-only identity provider. The certforge container reaches it as dex:5556;
# host-side tests map the name dex to 127.0.0.1 (Go: custom dialer,
# Playwright: --host-resolver-rules), so the issuer URL is the same everywhere.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticClients:
  - id: certforge
    name: CertForge
    secret: certforge-e2e-secret
    redirectURIs:
      - http://localhost:8080/api/v1/auth/oidc/callback
      - http://localhost:18080/api/v1/auth/oidc/callback
staticPasswords:
  - email: oidc-user@example.test
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: oidc-user
    userID: 5b1c0a8e-6a3f-4e0e-9a51-3f1e2b7c9d10
